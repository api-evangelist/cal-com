paths:
  /v2/organizations/{orgId}/teams/{teamId}/event-types/{eventTypeId}/private-links:
    post:
      description: If accessed using an OAuth access token, the `TEAM_EVENT_TYPE_WRITE` scope is required.
      operationId: OrganizationsEventTypesPrivateLinksController_2024_09_04_createPrivateLink
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to `2024-09-04`. Returns the full booking URL including org slug and event slug.
        required: true
        schema:
          type: string
          example: '2024-09-04'
          default: '2024-09-04'
      - name: Authorization
        in: header
        description: For non-platform customers - value must be `Bearer <token>` where `<token>` is api key prefixed with cal_
        required: false
        schema:
          type: string
      - name: x-cal-secret-key
        in: header
        description: For platform customers - OAuth client secret key
        required: false
        schema:
          type: string
      - name: x-cal-client-id
        in: header
        description: For platform customers - OAuth client ID
        required: false
        schema:
          type: string
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: orgId
        required: true
        in: path
        schema:
          type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrivateLinkInput'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePrivateLinkOutput'
      summary: Create a private link for a team event type
      tags:
      - Orgs / Teams / Event Types / Private Links
      x-oauth-scopes:
      - TEAM_EVENT_TYPE_WRITE
      x-platform-plan: ESSENTIALS
    get:
      description: If accessed using an OAuth access token, the `TEAM_EVENT_TYPE_READ` scope is required.
