components:
  schemas:
    TimeBasedPrivateLinkOutput:
      type: object
      properties:
        linkId:
          type: string
          description: The private link ID
          example: abc123def456
        eventTypeId:
          type: number
          description: Event type ID this link belongs to
          example: 123
        isExpired:
          type: boolean
          description: Whether the link is currently expired
          example: false
        bookingUrl:
          type: string
          description: Full booking URL for this private link (deprecated endpoints return hash-only URL without event slug)
          format: uri
          example: https://cal.com/d/abc123def456
        expiresAt:
          type: string
          description: Expiration date for this time-based link
          format: date-time
          example: '2025-12-31T23:59:59.000Z'
      required:
      - linkId
      - eventTypeId
      - isExpired
      - bookingUrl
      - expiresAt
    UpdatePrivateLinkOutput:
      type: object
      properties:
        status:
          type: string
          description: Response status
          example: success
        data:
          description: Updated private link data (either time-based or usage-based)
          oneOf:
          - title: Time-Based Link
            $ref: '#/components/schemas/TimeBasedPrivateLinkOutput'
          - title: Usage-Based Link
            $ref: '#/components/schemas/UsageBasedPrivateLinkOutput'
      required:
      - status
      - data
    UsageBasedPrivateLinkOutput:
      type: object
      properties:
        linkId:
          type: string
          description: The private link ID
          example: abc123def456
        eventTypeId:
          type: number
          description: Event type ID this link belongs to
          example: 123
        isExpired:
          type: boolean
          description: Whether the link is currently expired
          example: false
        bookingUrl:
          type: string
          description: Full booking URL for this private link (deprecated endpoints return hash-only URL without event slug)
          format: uri
          example: https://cal.com/d/abc123def456
        maxUsageCount:
          type: number
          description: Maximum number of times this link can be used
          example: 10
        usageCount:
          type: number
          description: Current usage count for this link
          example: 3
      required:
      - linkId
      - eventTypeId
      - isExpired
      - bookingUrl
      - maxUsageCount
      - usageCount
    CreatePrivateLinkInput:
      type: object
      properties:
        expiresAt:
          type: string
          description: Expiration date for time-based links
          format: date-time
          example: '2024-12-31T23:59:59.000Z'
        maxUsageCount:
          type: number
          description: Maximum number of times the link can be used. Pass `-1` to opt out of the count cap (the link is then gated only by `expiresAt`, or unbounded if that is also unset). If omitted and expiresAt is not provided, defaults to 1 (one time use).
          example: 10
          default: 1
    DeletePrivateLinkOutput:
      type: object
      properties:
        status:
          type: string
          description: Response status
          example: success
        data:
          type: object
          description: Deleted link information
          properties:
            linkId:
              type: string
              example: abc123def456
            message:
              type: string
              example: Private link deleted successfully
      required:
      - status
      - data
    GetPrivateLinksOutput:
      type: object
      properties:
        status:
          type: string
          description: Response status
          example: success
        data:
          type: array
          description: Array of private links for the event type (mix of time-based and usage-based)
          items:
            oneOf:
            - title: Time-Based Link
              $ref: '#/components/schemas/TimeBasedPrivateLinkOutput'
            - title: Usage-Based Link
              $ref: '#/components/schemas/UsageBasedPrivateLinkOutput'
      required:
      - status
      - data
    CreatePrivateLinkOutput:
      type: object
      properties:
        status:
          type: string
          description: Response status
          example: success
        data:
          description: Created private link data (either time-based or usage-based)
          oneOf:
          - title: Time-Based Link
            $ref: '#/components/schemas/TimeBasedPrivateLinkOutput'
          - title: Usage-Based Link
            $ref: '#/components/schemas/UsageBasedPrivateLinkOutput'
      required:
      - status
      - data
