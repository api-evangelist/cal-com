  /v2/organizations/{orgId}/teams/{teamId}/verified-resources/emails/verification-code/verify:
    post:
      description: 'Use code to verify an email. Required membership role: `team admin`. PBAC permission: `team.update`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `TEAM_VERIFIED_RESOURCES_WRITE` scope is required.'
