    WorkflowPathConditionInputDto_2026_09_22:
      type: object
      properties:
        id:
          type: string
          pattern: ^[\w-]{1,64}$
          description: Identifier of the condition. Generated when omitted; send the id from GET to edit one.
          example: b1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e5f
        field:
          type: string
          maxLength: 255
          description: The booking question or event field this condition reads. Use a field identifier returned by the workflow condition-fields endpoint.
          example: company-size
        operator:
          type: string
          maxLength: 64
          description: How the field is compared. The operator has to be one the field's type accepts — `equal` for a text or number field, `select_equals` for a select, `multiselect_equals` for a multiselect — because a condition whose operator its field rejects is scored false and silences the branch.
          example: select_equals
          enum:
          - between
          - equal
          - greater
          - greater_or_equal
          - is_empty
          - is_not_empty
          - less
          - less_or_equal
          - like
          - multiselect_equals
          - multiselect_not_equals
          - not_between
          - not_equal
          - not_like
          - select_any_in
          - select_equals
          - select_not_any_in
          - select_not_equals
          - starts_with
        values:
          maxItems: 100
          description: The values the field is compared against. Omit or send an empty list for operators that take none, such as is_empty.
          example:
          - enterprise
          default: []
          type: array
          items:
            type: string
            maxLength: 1000
      required:
      - field
      - operator
