          type: string
          description: How many of the conditions have to hold for this branch to match — the editor's All, Any and None.
          example: all
        conditions:
          description: The conditions deciding whether this path matches. A path with no conditions always matches.
          type: array
          items:
            $ref: '#/components/schemas/WorkflowPathConditionOutputDto'
      required:
      - id
      - name
      - position
      - matches
      - conditions
    UpdatePathsWorkflowStepDto:
      type: object
      properties:
        action:
          type: string
          enum:
          - paths
          description: 'Marks the step that splits the workflow into conditional paths. Paths and their conditions can only be edited in the Cal.com app. When updating steps, include this step as { action: "paths", id } using the id returned by GET so the split is preserved. It is always placed after every step outside a path, followed by the steps inside its paths, so it takes no stepNumber.'
          example: paths
        id:
          type: number
          description: Unique identifier of the existing paths step. A paths step cannot be created through the API, so the id is required.
          example: 67244
