      - action
      - id
    WorkflowPathConditionOutputDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the condition
          example: b1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e5f
        field:
          type: string
          description: 'What the condition reads: a booking question identifier, a routing form field id, or an event field id.'
          example: company-size
        operator:
          type: string
          description: 'How the field is compared, as the conditions editor stores it. The operator belongs to the field''s type: text, email, phone and number fields use `equal`, `not_equal`, `like`, `greater`, `between` and the like; a select uses `select_equals` or `select_any_in`; a multiselect uses `multiselect_equals`. To render an operator with the label the editor shows, resolve the field''s type from the booking questions of the event types this workflow is active on, or from the routing form''s fields for a form workflow.'
          example: select_equals
          enum:
          - between
          - equal
          - greater
          - greater_or_equal
          - is_empty
          - is_not_empty
          - less
          - less_or_equal
          - like
          - multiselect_equals
          - multiselect_not_equals
          - not_between
          - not_equal
          - not_like
          - select_any_in
          - select_equals
          - select_not_any_in
          - select_not_equals
          - starts_with
        values:
          description: The values the field is compared against. Empty for operators that take none, such as is_empty.
          example:
          - enterprise
          type: array
          items:
            type: string
      required:
      - id
      - field
      - operator
      - values
