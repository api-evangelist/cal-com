components:
  schemas:
    UpdateFilterWorkflowStepDto_2026_09_22:
      type: object
      properties:
        action:
          type: string
          enum:
          - filter
          description: Marks the step that gates everything after it on a set of conditions. Its position relative to the steps it gates is fixed, so it takes no stepNumber. Send `conditions` to author the gate and omit this step to delete it.
          example: filter
        id:
          type: number
          description: Unique identifier of an existing filter step, from GET. Omit it to create the gate.
          example: 67244
        gatedPathId:
          type: string
          format: uuid
          description: Id of the path this filter gates, so steps can name it as their pathId. Generated when omitted; send the gatedPathId from GET to keep the steps already behind this gate.
          example: 3f4c11a2-9b7e-4d15-8f0a-2f7de41b6c01
        matches:
          enum:
          - all
          - any
          - none
          - not_all
          type: string
          description: 'all: every condition matches; any: at least one matches; none: no conditions match; not_all: at least one condition does not match.'
          example: all
          default: all
        conditions:
          description: The conditions every following step is gated on. Omit to leave the persisted conditions untouched; send an empty list for a gate that passes everything.
          type: array
          items:
            $ref: '#/components/schemas/WorkflowPathConditionInputDto_2026_09_22'
        pathId:
          type: string
          format: uuid
          description: Id of the conditional path this filter itself sits inside. Omit it for a filter at the top level.
          example: 8b2f0c31-4a6d-4f89-b1c5-6d0e8a4f2b73
      required:
      - action
    RoutingFormWorkflowActivationOutputDto:
      type: object
      properties:
        isActiveOnAllRoutingForms:
          type: boolean
          default: false
          description: Whether the workflow is active for all routing forms associated with the team/user
          example: false
        activeOnRoutingFormIds:
          description: List of Event Type IDs the workflow is specifically active on (if not active on all)
          example:
          - 5cacdec7-1234-6e1b-78d9-7bcda8a1b332
          type: array
          items:
            type: string
    OnCreationTriggerDto:
      type: object
      properties:
        type:
          type: string
          default: newEvent
          enum:
          - newEvent
          description: Trigger type for the workflow
      required:
      - type
    WorkflowPhoneAttendeeStepDto:
      type: object
      properties:
        action:
          enum:
          - email_host
          - email_attendee
          - email_address
          - sms_attendee
          - sms_number
          - whatsapp_attendee
          - whatsapp_number
          - cal_ai_phone_call
          type: string
          default: sms_attendee
          description: Action to perform, send a text message to the phone numbers of the attendees
          example: sms_attendee
        stepNumber:
          type: number
          description: Step number in the workflow sequence
          example: 1
        recipient:
          type: string
          description: Recipient type
          example: attendee
          enum:
          - const
          - attendee
          - email
          - phone_number
        template:
          enum:
          - reminder
          - custom
          - rescheduled
          - completed
          - rating
          - cancelled
          type: string
          description: 'Template type for the step. Case-insensitive: uppercase values (e.g. `REMINDER`) are normalized to lowercase server-side for backwards compat.'
          example: reminder
        sender:
          type: string
          description: Displayed sender name.
        autoTranslateEnabled:
          type: boolean
          description: Whether to enable auto-translation of the workflow step content for attendees. Only available for organizations.
          example: false
          default: false
        sourceLocale:
          enum:
          - ar
          - ca
          - de
          - es
          - eu
          - he
          - id
          - ja
          - lv
          - pl
          - ro
          - sr
          - th
          - vi
          - az
          - cs
          - el
          - es-419
          - fi
          - hr
          - it
          - km
          - nl
          - pt
          - ru
          - sv
          - tr
          - zh-CN
          - bg
          - da
          - en
          - et
          - fr
          - hu
          - iw
          - ko
          - 'no'
          - pt-BR
          - sk
          - sl
          - ta
          - uk
          - zh-TW
          - bn
          type: string
          description: The source locale of the workflow step content used for auto-translation (e.g. 'en'). Defaults to the user's locale.
          example: en
        message:
          description: Message content for this step
          allOf:
          - $ref: '#/components/schemas/TextWorkflowMessageDto'
        phoneRequired:
          type: boolean
          default: false
          description: whether or not the attendees are required to provide their phone numbers when booking
          example: true
      required:
      - action
      - stepNumber
      - recipient
      - template
      - sender
      - message
    UpdateEmailAddressWorkflowStepDto:
      type: object
