components:
  schemas:
    UserOoosOutputResponseDto:
      type: object
      properties:
        status:
          enum:
          - success
          - error
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserOooOutputDto'
      required:
      - status
      - data
    UserOooOutputResponseDto:
      type: object
      properties:
        status:
          enum:
          - success
          - error
          type: string
          example: success
        data:
          $ref: '#/components/schemas/UserOooOutputDto'
      required:
      - status
      - data
    CreateOutOfOfficeEntryDto:
      type: object
      properties:
        start:
          format: date-time
          type: string
          description: The start date and time of the out of office period in ISO 8601 format in UTC timezone.
          example: '2023-05-01T00:00:00.000Z'
        end:
          format: date-time
          type: string
          description: The end date and time of the out of office period in ISO 8601 format in UTC timezone.
          example: '2023-05-10T23:59:59.999Z'
        notes:
          type: string
          description: Optional notes for the out of office entry.
          example: Vacation in Hawaii
        toUserId:
          type: number
          description: The ID of the user covering for the out of office period, if applicable.
          example: 2
        reason:
          enum:
          - unspecified
          - vacation
          - travel
          - sick
          - public_holiday
          type: string
          description: the reason for the out of office entry, if applicable
          example: vacation
      required:
      - start
      - end
    UserOooOutputDto:
      type: object
      properties:
        userId:
          type: number
          description: The ID of the user.
          example: 2
        toUserId:
          type: number
          description: The ID of the user covering for the out of office period, if applicable.
          example: 2
        id:
          type: number
          description: The ID of the ooo entry.
          example: 2
        uuid:
          type: string
          description: The UUID of the ooo entry.
          example: e84be5a3-4696-49e3-acc7-b2f3999c3b94
        start:
          format: date-time
          type: string
          description: The start date and time of the out of office period in ISO 8601 format in UTC timezone.
          example: '2023-05-01T00:00:00.000Z'
        end:
          format: date-time
          type: string
          description: The end date and time of the out of office period in ISO 8601 format in UTC timezone.
          example: '2023-05-10T23:59:59.999Z'
        notes:
          type: string
          description: Optional notes for the out of office entry.
          example: Vacation in Hawaii
        reason:
          enum:
          - unspecified
          - vacation
          - travel
          - sick
          - public_holiday
          type: string
          description: the reason for the out of office entry, if applicable
          example: vacation
      required:
      - userId
      - id
      - uuid
      - start
      - end
    UpdateOutOfOfficeEntryDto:
      type: object
      properties:
        start:
          format: date-time
          type: string
          description: The start date and time of the out of office period in ISO 8601 format in UTC timezone.
          example: '2023-05-01T00:00:00.000Z'
        end:
          format: date-time
          type: string
          description: The end date and time of the out of office period in ISO 8601 format in UTC timezone.
          example: '2023-05-10T23:59:59.999Z'
        notes:
          type: string
          description: Optional notes for the out of office entry.
          example: Vacation in Hawaii
        toUserId:
          type: number
          description: The ID of the user covering for the out of office period, if applicable.
          example: 2
        reason:
          enum:
          - unspecified
          - vacation
          - travel
          - sick
          - public_holiday
          type: string
          description: the reason for the out of office entry, if applicable
          example: vacation
