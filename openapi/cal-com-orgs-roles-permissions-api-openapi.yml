            - tag.delete
      responses:
        '204':
          description: ''
      summary: Remove multiple permissions from an organization role
      tags:
      - Orgs / Roles / Permissions
      x-platform-plan: SCALE
  /v2/organizations/{orgId}/roles/{roleId}/permissions/{permission}:
