          - string
          - 'null'
          description: Description of the role
        organizationId:
          type:
          - number
          - 'null'
          description: Organization ID this role belongs to
        type:
          enum:
          - SYSTEM
          - CUSTOM
          type: string
          description: Type of role
        permissions:
          type: array
          description: Permissions assigned to this role in 'resource.action' format.
          example:
          - booking.read
          - eventType.create
          items:
            type: string
