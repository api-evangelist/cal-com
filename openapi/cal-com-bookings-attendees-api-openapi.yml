openapi: 3.2.0
info:
  title: Cal.com API v2 Bookings / Attendees API
  description: ''
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Bookings / Attendees
paths:
  /v2/bookings/{bookingUid}/attendees:
    get:
      description: 'Retrieve all attendees for a specific booking by its UID.


        The cal-api-version header is required for this endpoint. Without it, the request will fail with a 404 error.


        If accessed using an OAuth access token, the `BOOKING_READ` scope is required.'
      operationId: BookingAttendeesController_2024_08_13_getBookingAttendees
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2024-08-13. This header is required as this endpoint does not exist in older API versions.
        required: true
        schema:
          type: string
          example: '2024-08-13'
      - name: bookingUid
        required: true
        in: path
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBookingAttendeesOutput_2024_08_13'
      summary: Get all attendees for a booking
      tags:
      - Bookings / Attendees
      x-mcp:
        name: get_booking_attendees
        guidance: Get all attendees for a booking by its UID.
      x-oauth-scopes:
      - BOOKING_READ
    post:
      description: 'Add a new attendee to an existing booking by its UID.


        **Seated Events:**

        This endpoint does not support seated event bookings. For seated events, each attendee must be added by creating a new booking for the same event type and time slot via `POST /v2/bookings`. Attempting to add an attendee to a seated event booking will return a 400 error.


        **Side effects:**

        - The booking''s attendee list is updated in the database

        - The calendar event is updated on connected calendars (Google Calendar, Outlook, etc.) to include the new attendee

        - An email notification is sent to the new attendee with the booking details


        **Permissions:**

        - The authenticated user must be either the booking organizer, an existing attendee, or have the `booking.update` permission for the team


        The cal-api-version header is required for this endpoint. Without it, the request will fail with a 404 error.


        If accessed using an OAuth access token, the `BOOKING_WRITE` scope is required.'
      operationId: BookingAttendeesController_2024_08_13_addAttendee
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2024-08-13. This header is required as this endpoint does not exist in older API versions.
        required: true
        schema:
          type: string
          example: '2024-08-13'
      - name: bookingUid
        required: true
        in: path
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAttendeeInput_2024_08_13'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddAttendeeOutput_2024_08_13'
      summary: Add an attendee to a booking
      tags:
      - Bookings / Attendees
      x-mcp:
        name: add_booking_attendee
        guidance: 'Add a new attendee to an existing booking. Required: name, email, timeZone. ASK THE USER for all attendee details — never guess or fabricate names, emails, or time zones.'
      x-oauth-scopes:
      - BOOKING_WRITE
  /v2/bookings/{bookingUid}/attendees/{attendeeId}:
    get:
      description: 'Retrieve a specific attendee by their ID for a booking identified by its UID.


        The cal-api-version header is required for this endpoint. Without it, the request will fail with a 404 error.


        If accessed using an OAuth access token, the `BOOKING_READ` scope is required.'
      operationId: BookingAttendeesController_2024_08_13_getBookingAttendee
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2024-08-13. This header is required as this endpoint does not exist in older API versions.
        required: true
        schema:
          type: string
          example: '2024-08-13'
      - name: bookingUid
        required: true
        in: path
        schema:
          type: string
      - name: attendeeId
        required: true
        in: path
        schema:
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBookingAttendeeOutput_2024_08_13'
      summary: Get a specific attendee for a booking
      tags:
      - Bookings / Attendees
      x-mcp:
        name: get_booking_attendee
        guidance: Get a specific attendee by their numeric ID within a booking. Use get_booking_attendees to find attendee IDs.
      x-oauth-scopes:
      - BOOKING_READ
