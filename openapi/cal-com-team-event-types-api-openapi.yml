openapi: 3.2.0
info:
  title: Cal.com API v2 Team Event Types API
  description: ''
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Team Event Types
paths:
  /v2/teams/{teamId}/event-types:
    post:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        If `bookingFields` is omitted, the event type is created with its default booking fields. At least one contact field—`email` or `attendeePhoneNumber`—must remain visible and required. Other default fields, such as additional notes, can be hidden. Provide `bookingFields` to customize the default fields or add custom booking fields. Required membership role: `team admin`. PBAC permission: `eventType.create`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `TEAM_EVENT_TYPE_WRITE` scope is required.'
      operationId: TeamsEventTypesController_2026_06_12_createTeamEventType
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamEventTypeInput_2026_06_12'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTeamEventTypeOutput_2026_06_12'
      summary: Create a team event type
      tags:
      - Team Event Types
      x-oauth-scopes:
      - TEAM_EVENT_TYPE_WRITE
    get:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Hidden event types and hidden booking fields are returned only to team administrators or owners, and parent-organization administrators or owners. Other callers see public event types and visible booking fields. Authentication is optional.'
      operationId: TeamsEventTypesController_2026_06_12_getTeamEventTypes
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventSlug
        required: false
        in: query
        description: Slug of team event type to return.
        schema:
          type: string
      - name: hostsLimit
        required: false
        in: query
        description: Specifies the maximum number of hosts to include in the response. This limit helps optimize performance. If not provided, all Hosts will be fetched.
        schema:
          type: number
      - name: sortCreatedAt
        required: false
        in: query
        description: Sort event types by creation date. When not provided, no explicit ordering is applied.
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTeamEventTypesOutput_2026_06_12'
      summary: List team event types
      tags:
      - Team Event Types
      x-oauth-scopes: []
  /v2/teams/{teamId}/event-types/{eventTypeId}:
    get:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Returns hidden booking fields only to callers who are allowed to view them. Required membership role: `team admin`. PBAC permission: `eventType.readTeamEventTypes`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `TEAM_EVENT_TYPE_READ` scope is required.'
      operationId: TeamsEventTypesController_2026_06_12_getTeamEventType
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTeamEventTypeOutput_2026_06_12'
      summary: Get a team event type
      tags:
      - Team Event Types
      x-oauth-scopes:
      - TEAM_EVENT_TYPE_READ
    patch:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Omit `bookingFields` to keep the existing booking fields. If provided, the array replaces them, and any omitted default fields are restored with their default settings. Required membership role: `team admin`. PBAC permission: `eventType.update`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `TEAM_EVENT_TYPE_WRITE` scope is required.'
      operationId: TeamsEventTypesController_2026_06_12_updateTeamEventType
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamEventTypeInput_2026_06_12'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTeamEventTypeOutput_2026_06_12'
      summary: Update a team event type
      tags:
      - Team Event Types
      x-oauth-scopes:
      - TEAM_EVENT_TYPE_WRITE
    delete:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Required membership role: `team admin`. PBAC permission: `eventType.delete`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `TEAM_EVENT_TYPE_WRITE` scope is required.'
      operationId: TeamsEventTypesController_2026_06_12_deleteTeamEventType
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTeamEventTypeOutput'
      summary: Delete a team event type
      tags:
      - Team Event Types
      x-oauth-scopes:
      - TEAM_EVENT_TYPE_WRITE
  /v2/teams/{teamId}/event-types/{eventTypeId}/calendar-invites:
    get:
      description: 'Returns host and guest settings resolved from the event type, an organization default when available, then Cal.com''s standard description. Access matches reading the team event type: the `eventType.readTeamEventTypes` PBAC permission, or team ADMIN/OWNER role when PBAC does not grant it. OAuth clients require `TEAM_EVENT_TYPE_READ`. Custom templates are limited to 5,000 characters. Event types outside the requested team return 404. Managed children inherit their parent''s settings and are marked read-only.'
      operationId: TeamsEventTypesController_2026_06_12_getTeamEventTypeCalendarInvites
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeCalendarInvitesOutput'
      summary: Get team event-type calendar-invite templates
      tags:
      - Team Event Types
      x-oauth-scopes:
      - TEAM_EVENT_TYPE_READ
    patch:
      description: 'Updates one or both audiences without changing other event-type fields; omitted audiences remain unchanged. Access matches updating the team event type: the `eventType.update` PBAC permission, or team ADMIN/OWNER role when PBAC does not grant it. OAuth clients require `TEAM_EVENT_TYPE_WRITE`. Custom templates are limited to 5,000 characters; HTML tags are stripped and Markdown links are kept. Managed children are read-only and return HTTP 400. Event types outside the requested team return 404.'
      operationId: TeamsEventTypesController_2026_06_12_updateTeamEventTypeCalendarInvites
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarInvitesInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeCalendarInvitesOutput'
      summary: Update team event-type calendar-invite templates
      tags:
      - Team Event Types
      x-oauth-scopes:
      - TEAM_EVENT_TYPE_WRITE
  /v2/teams/{teamId}/event-types/{eventTypeId}/create-phone-call:
    post:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Required membership role: `team admin`. PBAC permission: `eventType.update`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `TEAM_EVENT_TYPE_WRITE` scope is required.'
      operationId: TeamsEventTypesController_2026_06_12_createPhoneCall
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhoneCallInput'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePhoneCallOutput'
      summary: Create a phone call for a team event type
      tags:
      - Team Event Types
      x-oauth-scopes:
      - TEAM_EVENT_TYPE_WRITE
  /v2/teams/{teamId}/event-types/{eventTypeId}/booking-fields:
    get:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Returns default and custom booking fields, plus any read-only workflow-added fields. Required membership role: `team admin`. PBAC permission: `eventType.readTeamEventTypes`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `TEAM_EVENT_TYPE_READ` scope is required.'
      operationId: TeamsEventTypesController_2026_06_12_getBookingFields
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFieldsOutput_2026_06_12'
      summary: Get team booking fields
      tags:
      - Team Event Types
      x-oauth-scopes:
      - TEAM_EVENT_TYPE_READ
    put:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Replaces all booking fields. Omitted custom fields are deleted, while omitted default fields are restored with their default settings. Use `PATCH` to update specific fields. Workflow-added fields are read-only and ignored. Required membership role: `team admin`. PBAC permission: `eventType.update`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `TEAM_EVENT_TYPE_WRITE` scope is required.'
      operationId: TeamsEventTypesController_2026_06_12_replaceBookingFields
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingFieldsInput_2026_06_12'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFieldsOutput_2026_06_12'
      summary: Replace team booking fields
      tags:
      - Team Event Types
      x-oauth-scopes:
      - TEAM_EVENT_TYPE_WRITE
    post:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Adds custom booking fields. Default and workflow-added fields cannot be added through this endpoint. Required membership role: `team admin`. PBAC permission: `eventType.update`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `TEAM_EVENT_TYPE_WRITE` scope is required.'
      operationId: TeamsEventTypesController_2026_06_12_createCustomBookingFields
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingFieldsInput_2026_06_12'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFieldsOutput_2026_06_12'
      summary: Add custom team booking fields
      tags:
      - Team Event Types
      x-oauth-scopes:
      - TEAM_EVENT_TYPE_WRITE
    patch:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Updates the booking fields identified by `slug`. Omitted properties keep their current values. Workflow-added fields are read-only. Required membership role: `team admin`. PBAC permission: `eventType.update`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `TEAM_EVENT_TYPE_WRITE` scope is required.'
      operationId: TeamsEventTypesController_2026_06_12_updateBookingFields
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBookingFieldsInput_2026_06_12'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFieldsOutput_2026_06_12'
      summary: Update team booking fields
      tags:
      - Team Event Types
      x-oauth-scopes:
      - TEAM_EVENT_TYPE_WRITE
  /v2/teams/{teamId}/event-types/{eventTypeId}/booking-fields/{slug}:
    delete:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Deletes the custom booking field identified by `slug`. Default fields cannot be deleted, set hidden instead. Required membership role: `team admin`. PBAC permission: `eventType.update`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `TEAM_EVENT_TYPE_WRITE` scope is required.'
      operationId: TeamsEventTypesController_2026_06_12_deleteCustomBookingField
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: slug
        required: true
        in: path
        schema:
          type: string
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFieldsOutput_2026_06_12'
      summary: Delete a custom team booking field
      tags:
      - Team Event Types
      x-oauth-scopes:
      - TEAM_EVENT_TYPE_WRITE
components:
  schemas:
    PartialOmitSystemRescheduleReasonFieldInput_2026_06_12Field:
      type: object
      properties:
        slug:
          type: string
          example: rescheduleReason
          description: Only allowed value is 'rescheduleReason'.
        required:
          type: boolean
        hidden:
          type: boolean
          description: Hide this booking field from the booking page while keeping it in the event type's settings. Hidden fields are only returned to callers authorized on the event type.
        label:
          type: string
        placeholder:
          type: string
        disableOnPrefill:
          type: boolean
          description: Disable this booking field if the URL contains query parameter with key equal to the slug and prefill it with the provided value.    For example, if URL contains query parameter `&rescheduleReason=travel`,    the rescheduleReason field will be prefilled with this value and disabled.
    CustomPhoneFieldOutput_2026_06_12:
      type: object
      properties:
        field:
          type: string
          example: custom
          description: Identifies this as a custom booking field.
        slug:
          type: string
          description: Unique slug identifier for this custom field.
          example: some-slug
        label:
          type: string
          example: Your custom field label
        required:
          type: boolean
        hidden:
          type: boolean
          description: Hide this booking field from the booking page while keeping it in the event type's settings. Hidden fields are only returned to callers authorized on the event type.
        placeholder:
          type: string
        disableOnPrefill:
