openapi: 3.2.0
info:
  title: Cal.com API v2 Verified Resources API
  description: ''
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Verified Resources
paths:
  /v2/verified-resources/emails/verification-code/request:
    post:
      description: Sends a verification code to the email. If accessed using an OAuth access token, the `VERIFIED_RESOURCES_WRITE` scope is required.
      operationId: UserVerifiedResourcesController_requestEmailVerificationCode
      parameters:
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailVerificationInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestEmailVerificationOutput'
      summary: Request email verification code
      tags:
      - Verified Resources
      x-oauth-scopes:
      - VERIFIED_RESOURCES_WRITE
  /v2/verified-resources/phones/verification-code/request:
    post:
      description: Sends a verification code to the phone number. If accessed using an OAuth access token, the `VERIFIED_RESOURCES_WRITE` scope is required.
      operationId: UserVerifiedResourcesController_requestPhoneVerificationCode
      parameters:
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPhoneVerificationInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPhoneVerificationOutput'
      summary: Request phone number verification code
      tags:
      - Verified Resources
      x-oauth-scopes:
      - VERIFIED_RESOURCES_WRITE
  /v2/verified-resources/emails/verification-code/verify:
    post:
      description: Use code to verify an email. If accessed using an OAuth access token, the `VERIFIED_RESOURCES_WRITE` scope is required.
      operationId: UserVerifiedResourcesController_verifyEmail
      parameters:
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVerifiedEmailOutput'
      summary: Verify an email
      tags:
      - Verified Resources
      x-oauth-scopes:
      - VERIFIED_RESOURCES_WRITE
  /v2/verified-resources/phones/verification-code/verify:
    post:
      description: Use code to verify a phone number. If accessed using an OAuth access token, the `VERIFIED_RESOURCES_WRITE` scope is required.
      operationId: UserVerifiedResourcesController_verifyPhoneNumber
      parameters:
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPhoneInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVerifiedPhoneOutput'
      summary: Verify a phone number
      tags:
      - Verified Resources
      x-oauth-scopes:
      - VERIFIED_RESOURCES_WRITE
  /v2/verified-resources/emails:
    get:
      description: If accessed using an OAuth access token, the `VERIFIED_RESOURCES_READ` scope is required.
      operationId: UserVerifiedResourcesController_getVerifiedEmails
      parameters:
      - name: take
        required: false
        in: query
        description: Maximum number of items to return
        schema:
          minimum: 1
          maximum: 250
          default: 250
          example: 25
          type: number
      - name: skip
        required: false
        in: query
        description: Number of items to skip
        schema:
          minimum: 0
          default: 0
          example: 0
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVerifiedEmailsOutput'
      summary: Get list of verified emails
      tags:
      - Verified Resources
      x-oauth-scopes:
      - VERIFIED_RESOURCES_READ
  /v2/verified-resources/phones:
    get:
      description: If accessed using an OAuth access token, the `VERIFIED_RESOURCES_READ` scope is required.
      operationId: UserVerifiedResourcesController_getVerifiedPhoneNumbers
      parameters:
      - name: take
        required: false
        in: query
        description: Maximum number of items to return
        schema:
          minimum: 1
          maximum: 250
          default: 250
          example: 25
          type: number
      - name: skip
        required: false
        in: query
        description: Number of items to skip
        schema:
          minimum: 0
          default: 0
          example: 0
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVerifiedPhonesOutput'
      summary: Get list of verified phone numbers
      tags:
      - Verified Resources
      x-oauth-scopes:
      - VERIFIED_RESOURCES_READ
  /v2/verified-resources/emails/{id}:
    get:
      description: If accessed using an OAuth access token, the `VERIFIED_RESOURCES_READ` scope is required.
      operationId: UserVerifiedResourcesController_getVerifiedEmailById
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVerifiedEmailOutput'
      summary: Get verified email by id
      tags:
      - Verified Resources
      x-oauth-scopes:
      - VERIFIED_RESOURCES_READ
  /v2/verified-resources/phones/{id}:
    get:
      description: If accessed using an OAuth access token, the `VERIFIED_RESOURCES_READ` scope is required.
      operationId: UserVerifiedResourcesController_getVerifiedPhoneById
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVerifiedPhoneOutput'
      summary: Get verified phone number by id
      tags:
      - Verified Resources
      x-oauth-scopes:
      - VERIFIED_RESOURCES_READ
components:
  schemas:
    VerifyPhoneInput:
      type: object
      properties:
        phone:
          type: string
          description: phone number to verify.
          example: '+37255556666'
        code:
          type: string
          description: verification code sent to the phone number to verify
          example: 1ABG2C
      required:
      - phone
      - code
    VerifyEmailInput:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email to verify.
          example: example@acme.com
        code:
          type: string
          description: verification code sent to the email to verify
          example: 1ABG2C
      required:
      - email
      - code
    RequestEmailVerificationInput:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email to verify.
          example: acme@example.com
      required:
      - email
    UserVerifiedPhonesOutput:
      type: object
      properties:
        status:
          enum:
          - success
          - error
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserVerifiedPhoneOutputData'
      required:
      - status
      - data
    RequestPhoneVerificationInput:
      type: object
      properties:
        phone:
          type: string
          description: Phone number to verify.
          example: +372 5555 6666
      required:
      - phone
    UserVerifiedPhoneOutputData:
      type: object
      properties:
        id:
          type: number
          description: The unique identifier for the verified email.
          example: 789
        phoneNumber:
          type: string
          description: The verified phone number.
          example: '+37255556666'
          format: phone
        userId:
          type: number
          description: The ID of the associated user, if applicable.
          example: 45
      required:
      - id
      - phoneNumber
      - userId
    UserVerifiedEmailOutput:
      type: object
      properties:
        status:
          enum:
          - success
          - error
          type: string
          example: success
        data:
          $ref: '#/components/schemas/UserVerifiedEmailOutputData'
      required:
      - status
      - data
    RequestEmailVerificationOutput:
      type: object
      properties:
        status:
          type: string
          example: success
          enum:
          - success
          - error
      required:
      - status
    UserVerifiedEmailOutputData:
      type: object
      properties:
        id:
          type: number
          description: The unique identifier for the verified email.
          example: 789
        email:
          type: string
          description: The verified email address.
          example: user@example.com
          format: email
        userId:
          type: number
          description: The ID of the associated user, if applicable.
          example: 45
      required:
      - id
      - email
      - userId
    RequestPhoneVerificationOutput:
      type: object
      properties:
        status:
          type: string
          example: success
          enum:
          - success
          - error
      required:
      - status
    UserVerifiedEmailsOutput:
      type: object
      properties:
        status:
          enum:
          - success
          - error
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserVerifiedEmailOutputData'
      required:
      - status
      - data
    UserVerifiedPhoneOutput:
      type: object
      properties:
        status:
          enum:
          - success
          - error
          type: string
          example: success
        data:
          $ref: '#/components/schemas/UserVerifiedPhoneOutputData'
      required:
      - status
      - data
