openapi: 3.2.0
info:
  title: Cal.com API v2 Destination Calendars API
  description: ''
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Destination Calendars
paths:
  /v2/destination-calendars:
    put:
      description: If accessed using an OAuth access token, the `APPS_WRITE` scope is required.
      operationId: DestinationCalendarsController_updateDestinationCalendars
      parameters:
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationCalendarsInputBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationCalendarsOutputResponseDto'
      summary: Update destination calendars
      tags:
      - Destination Calendars
      x-oauth-scopes:
      - APPS_WRITE
components:
  schemas:
    DestinationCalendarsOutputDto:
      type: object
      properties:
        userId:
          type: number
        integration:
          type: string
        externalId:
          type: string
        credentialId:
          type:
          - number
          - 'null'
      required:
      - userId
      - integration
      - externalId
      - credentialId
    DestinationCalendarsOutputResponseDto:
      type: object
      properties:
        status:
          enum:
          - success
          - error
          type: string
          example: success
        data:
          $ref: '#/components/schemas/DestinationCalendarsOutputDto'
      required:
      - status
      - data
    DestinationCalendarsInputBodyDto:
      type: object
      properties:
        integration:
          enum:
          - apple_calendar
          - google_calendar
          - office365_calendar
          type: string
          example: apple_calendar
          description: The calendar service you want to integrate, as returned by the /calendars endpoint
        externalId:
          type: string
          example: https://caldav.icloud.com/26962146906/calendars/1644422A-1945-4438-BBC0-4F0Q23A57R7S/
          description: Unique identifier used to represent the specific calendar, as returned by the /calendars endpoint
        delegationCredentialId:
          type: string
      required:
      - integration
      - externalId
