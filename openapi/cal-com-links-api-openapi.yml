openapi: 3.2.0
info:
  title: Cal.com API v2 Links API
  description: ''
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Links
paths:
  /v2/links/{linkUid}:
    get:
      description: Returns hidden booking fields only to callers who are allowed to view them. If accessed using an OAuth access token, the `EVENT_TYPE_READ` scope is required.
      operationId: LinksController_getLink
      parameters:
      - name: linkUid
        required: true
        in: path
        description: Link UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLinkOutput'
        '400':
          description: Invalid link UUID
        '404':
          description: Link not found
      summary: Get a link
      tags:
      - Links
      x-oauth-scopes:
      - EVENT_TYPE_READ
components:
  schemas:
    CustomLongTextFieldOutput_2026_06_12:
      type: object
      properties:
        field:
          type: string
          example: custom
          description: Identifies this as a custom booking field.
        slug:
          type: string
          description: Unique slug identifier for this custom field.
          example: some-slug
        label:
          type: string
          example: Your custom field label
        required:
          type: boolean
        hidden:
          type: boolean
          description: Hide this booking field from the booking page while keeping it in the event type's settings. Hidden fields are only returned to callers authorized on the event type.
        placeholder:
          type: string
        disableOnPrefill:
          type: boolean
          description: Disable this booking field if the URL contains query parameter with key equal to the slug and prefill it with the provided value.    For example, if the slug is `my-field` and the URL contains `&my-field=value`,    the field will be prefilled with this value and disabled.
        type:
          type: string
          example: longText
          enum:
          - longText
          description: A multi-line text input on the booking page.
        minLength:
          type: number
          description: Minimum character length for the long text field.
        maxLength:
          type: number
          description: Maximum character length for the long text field.
      required:
      - field
      - slug
      - label
      - required
      - hidden
      - disableOnPrefill
      - type
    SystemSmsReminderFieldOutput_2026_06_12:
      type: object
      properties:
        required:
          type: boolean
        hidden:
          type: boolean
          description: Hide this booking field from the booking page while keeping it in the event type's settings. Hidden fields are only returned to callers authorized on the event type.
        label:
          type: string
          example: Your default field label
        placeholder:
          type: string
        disableOnPrefill:
          type: boolean
          description: Disable this booking field if the URL contains query parameter with key equal to the slug and prefill it with the provided value.    For example, if the slug is `my-field` and the URL contains `&my-field=value`,    the field will be prefilled with this value and disabled.
        field:
          type: string
          example: smsReminderNumber
          description: Phone-number field added automatically by an SMS workflow.
        slug:
          type: string
          example: smsReminderNumber
          description: This workflow-added field always uses `smsReminderNumber` as its slug.
      required:
      - required
      - hidden
      - disableOnPrefill
      - field
      - slug
    Recurrence_2024_06_14:
      type: object
      properties:
        interval:
          type: number
          example: 1
          description: Repeats every {count} week | month | year
          minimum: 1
          maximum: 20
        occurrences:
          type: number
          example: 10
          description: Repeats for a maximum of {count} events
          minimum: 1
          maximum: 32
        frequency:
          enum:
          - yearly
          - monthly
          - weekly
          type: string
        disabled:
          type: boolean
          default: false
      required:
      - interval
      - occurrences
      - frequency
    SystemNotesFieldOutput_2026_06_12:
      type: object
      properties:
        required:
          type: boolean
        hidden:
          type: boolean
          description: Hide this booking field from the booking page while keeping it in the event type's settings. Hidden fields are only returned to callers authorized on the event type.
        label:
          type: string
          example: Your default field label
        placeholder:
          type: string
        disableOnPrefill:
          type: boolean
          description: Disable this booking field if the URL contains query parameter with key equal to the slug and prefill it with the provided value.    For example, if the slug is `my-field` and the URL contains `&my-field=value`,    the field will be prefilled with this value and disabled.
        field:
          type: string
          example: notes
          description: Identifies this as the notes default booking field.
        slug:
          type: string
          example: notes
          description: The default additional-notes field always uses `notes` as its slug.
      required:
      - required
      - hidden
      - disableOnPrefill
      - field
      - slug
    RangeWindow_2024_06_14:
      type: object
      properties:
        type:
          type: string
          enum:
          - businessDays
          - calendarDays
          - range
          description: Whether the window should be business days, calendar days or a range of dates
        value:
          minItems: 1
          example:
          - '2030-09-05'
          - '2030-09-09'
          description: Date range for when this event can be booked.
          type: array
          items:
            type: string
        disabled:
          type: boolean
          default: false
      required:
      - type
      - value
    CustomPhoneFieldOutput_2026_06_12:
      type: object
      properties:
        field:
          type: string
          example: custom
          description: Identifies this as a custom booking field.
        slug:
          type: string
          description: Unique slug identifier for this custom field.
          example: some-slug
        label:
          type: string
          example: Your custom field label
        required:
          type: boolean
        hidden:
          type: boolean
          description: Hide this booking field from the booking page while keeping it in the event type's settings. Hidden fields are only returned to callers authorized on the event type.
        placeholder:
          type: string
        disableOnPrefill:
          type: boolean
          description: Disable this booking field if the URL contains query parameter with key equal to the slug and prefill it with the provided value.    For example, if the slug is `my-field` and the URL contains `&my-field=value`,    the field will be prefilled with this value and disabled.
        type:
          type: string
          example: phone
          enum:
          - phone
          description: A phone-number input on the booking page.
      required:
      - field
      - slug
      - label
      - required
      - hidden
      - disableOnPrefill
      - type
    TeamLinkOutput:
      type: object
      properties:
        lengthInMinutes:
          type: number
          example: 60
        lengthInMinutesOptions:
          example:
          - 15
          - 30
          - 60
          description: If you want that user can choose between different lengths of the event you can specify them here. Must include the provided `lengthInMinutes`.
          type: array
          items:
            type: number
        title:
          type: string
          example: Learn the secrets of masterchief!
        slug:
          type: string
          example: learn-the-secrets-of-masterchief
        description:
          type: string
          example: Discover the culinary wonders of Argentina by making the best flan ever!
        locations:
          type: array
          items:
            oneOf:
            - title: Address
              $ref: '#/components/schemas/OutputAddressLocation_2024_06_14'
            - title: Link
              $ref: '#/components/schemas/OutputLinkLocation_2024_06_14'
            - title: Integration
              $ref: '#/components/schemas/OutputIntegrationLocation_2024_06_14'
            - title: Phone
              $ref: '#/components/schemas/OutputPhoneLocation_2024_06_14'
            - title: Organizer Default App
              $ref: '#/components/schemas/OutputOrganizersDefaultAppLocation_2024_06_14'
            - title: Unknown
              $ref: '#/components/schemas/OutputUnknownLocation_2024_06_14'
        disableGuests:
          type: boolean
        slotInterval:
          type:
          - number
          - 'null'
          example: 60
        minimumBookingNotice:
          type: number
          example: 0
        beforeEventBuffer:
          type: number
          example: 0
        afterEventBuffer:
          type: number
          example: 0
        recurrence:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Recurrence_2024_06_14'
        metadata:
          type: object
          readOnly: true
        price:
          type: number
        currency:
          type: string
        lockTimeZoneToggleOnBookingPage:
          type: boolean
        seatsPerTimeSlot:
          type:
          - number
          - 'null'
        forwardParamsSuccessRedirect:
          type:
          - boolean
          - 'null'
        successRedirectUrl:
          type:
          - string
          - 'null'
        isInstantEvent:
          type: boolean
        seatsShowAvailabilityCount:
          type:
          - boolean
          - 'null'
        scheduleId:
          type:
          - number
          - 'null'
        bookingLimitsCount:
          oneOf:
          - title: Booking Count Limit
            $ref: '#/components/schemas/BaseBookingLimitsCount_2024_06_14'
          - title: Disabled
            $ref: '#/components/schemas/Disabled_2024_06_14'
        bookerActiveBookingsLimit:
          $ref: '#/components/schemas/BookerActiveBookingsLimitOutput_2024_06_14'
        onlyShowFirstAvailableSlot:
          type: boolean
        bookingLimitsDuration:
          oneOf:
          - title: Booking Duration Limit
            $ref: '#/components/schemas/BaseBookingLimitsDuration_2024_06_14'
          - title: Disabled
            $ref: '#/components/schemas/Disabled_2024_06_14'
        bookingWindow:
          type: array
          description: Limit how far in the future this event can be booked
          items:
            oneOf:
            - title: Business Days
              $ref: '#/components/schemas/BusinessDaysWindow_2024_06_14'
            - title: Calendar Days
              $ref: '#/components/schemas/CalendarDaysWindow_2024_06_14'
            - title: Date Range
              $ref: '#/components/schemas/RangeWindow_2024_06_14'
        bookerLayouts:
          $ref: '#/components/schemas/BookerLayouts_2024_06_14'
        confirmationPolicy:
          oneOf:
          - title: Confirmation Required
            $ref: '#/components/schemas/BaseConfirmationPolicy_2024_06_14'
          - title: Disabled
            $ref: '#/components/schemas/Disabled_2024_06_14'
        bookingProposalCount:
          type:
          - number
          - 'null'
          description: Maximum number of timeslots a proposal may include. The client chooses from 1 through this maximum. Null uses the default single-slot booking flow.
        requiresBookerEmailVerification:
          type: boolean
        skipAttendeeEmailDeliverabilityCheck:
          type: boolean
          description: When true, the MX deliverability check for attendee emails is skipped on booking. Format validation and watchlist still apply. Org-only (including platform orgs).
        emailSettings:
          description: Email settings for this event type. Personal event types require an accepted organization membership; team event types require an organization team. This does not include emails sent by custom email workflows.
          allOf:
          - $ref: '#/components/schemas/EmailSettings_2024_06_14'
        hideCalendarNotes:
          type: boolean
        color:
          $ref: '#/components/schemas/EventTypeColor_2024_06_14'
        seats:
          $ref: '#/components/schemas/Seats_2024_06_14'
        offsetStart:
          type: number
        customName:
          type: string
        destinationCalendar:
          $ref: '#/components/schemas/DestinationCalendar_2024_06_14'
        useDestinationCalendarEmail:
          type: boolean
        hideCalendarEventDetails:
          type: boolean
        hideOrganizerEmail:
          type: boolean
          description: Boolean to Hide organizer's email address from the booking screen, email notifications, and calendar events
        calVideoSettings:
          description: Cal video settings for the event type
          allOf:
          - $ref: '#/components/schemas/CalVideoSettings'
        hidden:
          type: boolean
        bookingRequiresAuthentication:
          type: boolean
          description: Boolean to require authentication for booking this event type via api. If true, only authenticated users who are the event-type owner or org/team admin/owner can book this event type.
        disableCancelling:
          description: Settings for disabling cancelling of this event type.
          allOf:
          - $ref: '#/components/schemas/DisableCancellingOutput_2024_06_14'
        disableRescheduling:
          description: Settings for disabling rescheduling of this event type. Can be always disabled or disabled when less than X minutes before the meeting.
          allOf:
          - $ref: '#/components/schemas/DisableReschedulingOutput_2024_06_14'
        interfaceLanguage:
          type:
          - string
          - 'null'
          description: Set preferred language for the booking interface.
        weekStart:
          type:
          - string
          - 'null'
          description: Day the booking page calendar starts the week on. Overrides the host's account setting for this event type only.
        allowReschedulingPastBookings:
          type: boolean
          description: Enabling this option allows for past events to be rescheduled.
        allowReschedulingCancelledBookings:
          type:
          - boolean
          - 'null'
          description: When enabled, users will be able to create a new booking when trying to reschedule a cancelled booking.
        showOptimizedSlots:
          type:
          - boolean
          - 'null'
          description: Arrange time slots to optimize availability.
        useIsolatedAvailability:
          type: boolean
          description: When true, only this event type's own Cal.com bookings block the slot. The availability schedule and connected calendars still apply. Same as "Consider only this booking link's bookings" in the web app. Requires an organization with at least 15 members.
        privateNoteEnabled:
          type: boolean
          description: When enabled, a private note calendar event is created alongside the booking with the resolved template as its description. Only visible to the host.
        privateNoteMode:
          description: 'How private notes are delivered: as an additional host event or by sending separate host and guest invites.'
          allOf:
          - $ref: '#/components/schemas/PrivateNoteMode'
        privateNoteTemplate:
          type:
          - string
          - 'null'
          description: Template for the private note content. Supports variables like {Attendee name}, {Link title}, {Event type title} (legacy), {Location}, {Host name}, {Event duration}, and custom booking field names.
        teamId:
          type: number
        bookingUrl:
          type:
          - string
          - 'null'
          description: Full URL to the booking page for this team event type. Null for managed team event types or when the team does not have a slug.
          example: https://cal.com/team/acme/30min
          format: uri
        ownerId:
          type:
          - number
          - 'null'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/TeamEventTypeResponseHost'
        assignAllTeamMembers:
          type: boolean
        schedulingType:
          enum:
          - roundRobin
          - collective
          - managed
          type:
          - string
          - 'null'
        team:
          $ref: '#/components/schemas/EventTypeTeam'
        rescheduleWithSameRoundRobinHost:
          type: boolean
          description: Rescheduled events will be assigned to the same host as initially scheduled.
        allowRRHostChoiceOnReschedule:
          type: boolean
          description: Let the person rescheduling choose between keeping the original host and letting round robin pick from the whole team.
        isRRWeightsEnabled:
          type: boolean
          description: Only relevant for round robin event types. If true, bookings are distributed according to each host's `weight` instead of evenly.
        bookingFields:
          type: array
          items:
            discriminator:
              propertyName: field
            oneOf:
            - title: Default Name
              discriminator:
                propertyName: variant
              oneOf:
              - title: Default Full Name
                $ref: '#/components/schemas/SystemFullNameFieldOutput_2026_06_12'
              - title: Default Split Name
                $ref: '#/components/schemas/SystemSplitNameFieldOutput_2026_06_12'
            - title: Default Email
              $ref: '#/components/schemas/SystemEmailFieldOutput_2026_06_12'
            - title: Default Location
              $ref: '#/components/schemas/SystemLocationFieldOutput_2026_06_12'
            - title: Default Title
              $ref: '#/components/schemas/SystemTitleFieldOutput_2026_06_12'
            - title: Default Notes
              $ref: '#/components/schemas/SystemNotesFieldOutput_2026_06_12'
            - title: Default Guests
              $ref: '#/components/schemas/SystemGuestsFieldOutput_2026_06_12'
            - title: Default Reschedule Reason
              $ref: '#/components/schemas/SystemRescheduleReasonFieldOutput_2026_06_12'
            - title: Default Attendee Phone
              $ref: '#/components/schemas/SystemAttendeePhoneFieldOutput_2026_06_12'
            - title: Workflow-added SMS Reminder
              $ref: '#/components/schemas/SystemSmsReminderFieldOutput_2026_06_12'
            - title: Workflow-added AI Agent Phone
              $ref: '#/components/schemas/SystemAiAgentPhoneFieldOutput_2026_06_12'
            - title: Custom Booking Field
              discriminator:
                propertyName: type
              oneOf:
              - title: Custom Email
                $ref: '#/components/schemas/CustomEmailFieldOutput_2026_06_12'
              - title: Custom Phone
                $ref: '#/components/schemas/CustomPhoneFieldOutput_2026_06_12'
              - title: Custom Address
                $ref: '#/components/schemas/CustomAddressFieldOutput_2026_06_12'
              - title: Custom Short Text
                $ref: '#/components/schemas/CustomShortTextFieldOutput_2026_06_12'
              - title: Custom Number
                $ref: '#/components/schemas/CustomNumberFieldOutput_2026_06_12'
              - title: Custom Long Text
                $ref: '#/components/schemas/CustomLongTextFieldOutput_2026_06_12'
              - title: Custom Select
                $ref: '#/components/schemas/CustomSelectFieldOutput_2026_06_12'
              - title: Custom Multi-Select
                $ref: '#/components/schemas/CustomMultiSelectFieldOutput_2026_06_12'
              - title: Custom Multiple Emails
                $ref: '#/components/schemas/CustomMultiEmailFieldOutput_2026_06_12'
              - title: Custom Checkbox Group
                $ref: '#/components/schemas/CustomCheckboxGroupFieldOutput_2026_06_12'
              - title: Custom Radio Group
                $ref: '#/components/schemas/CustomRadioGroupFieldOutput_2026_06_12'
              - title: Custom Checkbox
                $ref: '#/components/schemas/CustomCheckboxFieldOutput_2026_06_12'
              - title: Custom URL
                $ref: '#/components/schemas/CustomUrlFieldOutput_2026_06_12'
            - title: Unknown Booking Field
              $ref: '#/components/schemas/UnknownBookingFieldOutput_2026_06_12'
          description: The event type's default, custom, and workflow-added booking fields.
        crm:
          description: CRM app settings configured for this event type, mirroring the event type Apps tab toggles.
          allOf:
          - $ref: '#/components/schemas/CrmSettingsOutput_2026_06_12'
        uuid:
          type: string
          format: uuid
          example: 018ff5cd-6dc4-7d57-bcbc-374702ca8b38
        parentLinkUid:
          type:
          - string
          - 'null'
          format: uuid
          description: The uuid of the managed parent link this link was created from.
      required:
      - lengthInMinutes
      - title
      - slug
      - description
      - locations
      - disableGuests
      - recurrence
      - metadata
      - price
      - currency
      - lockTimeZoneToggleOnBookingPage
      - forwardParamsSuccessRedirect
      - successRedirectUrl
      - isInstantEvent
      - scheduleId
      - hidden
      - bookingRequiresAuthentication
      - teamId
      - bookingUrl
      - hosts
      - schedulingType
      - team
      - bookingFields
      - crm
      - uuid
      - parentLinkUid
    CustomEmailFieldOutput_2026_06_12:
      type: object
      properties:
        field:
          type: string
          example: custom
          description: Identifies this as a custom booking field.
        slug:
          type: string
          description: Unique slug identifier for this custom field.
          example: some-slug
        label:
          type: string
          example: Your custom field label
        required:
          type: boolean
        hidden:
          type: boolean
          description: Hide this booking field from the booking page while keeping it in the event type's settings. Hidden fields are only returned to callers authorized on the event type.
        placeholder:
          type: string
        disableOnPrefill:
          type: boolean
          description: Disable this booking field if the URL contains query parameter with key equal to the slug and prefill it with the provided value.    For example, if the slug is `my-field` and the URL contains `&my-field=value`,    the field will be prefilled with this value and disabled.
        type:
          type: string
          example: email
          enum:
          - email
          description: An email input on the booking page.
        excludeEmails:
          description: Bookers whose email matches an entry cannot book. Entries may be a bare domain (`example.com`), a domain with `@` (`@example.com`), or an exact address (`person@example.com`). Matching is case-insensitive.
          type: array
          items:
            type: string
        requireEmails:
          description: Only bookers whose email matches an entry can book. Entries may be a bare domain (`example.com`), a domain with `@` (`@example.com`), or an exact address (`person@example.com`). Matching is case-insensitive.
          type: array
          items:
            type: string
      required:
      - field
      - slug
      - label
      - required
      - hidden
      - disableOnPrefill
      - type
    GetLinkOutput:
      type: object
      properties:
        status:
          type: string
          example: success
          enum:
          - success
          - error
        data:
          oneOf:
          - title: Link
            $ref: '#/components/schemas/LinkOutput'
          - title: Team Link
            $ref: '#/components/schemas/TeamLinkOutput'
      required:
      - status
      - data
    BookerActiveBookingsLimitOutput_2024_06_14:
      type: object
      properties:
        maximumActiveBookings:
          type: number
          minimum: 1
          description: The maximum number of active bookings a booker can have for this event type.
          example: 3
        offerReschedule:
          type: boolean
          description: Whether to offer rescheduling the last active booking to the chosen time slot when limit is reached.
    UnknownBookingFieldOutput_2026_06_12:
      type: object
      properties:
        field:
          type: string
          example: unknown
          enum:
          - unknown
        slug:
          type: string
          example: unknown
          enum:
          - unknown
        bookingField:
          type: string
          description: Raw booking-field data that this API version does not recognize.
      required:
      - field
      - slug
      - bookingField
    CustomMultiSelectFieldOutput_2026_06_12:
      type: object
      properties:
        field:
          type: string
          example: custom
          description: Identifies this as a custom booking field.
        slug:
          type: string
          description: Unique slug identifier for this custom field.
          example: some-slug
        label:
          type: string
          example: Your custom field label
        required:
          type: boolean
        hidden:
          type: boolean
          description: Hide this booking field from the booking page while keeping it in the event type's settings. Hidden fields are only returned to callers authorized on the event type.
        placeholder:
          type: string
        disableOnPrefill:
          type: boolean
          description: Disable this booking field if the URL contains query parameter with key equal to the slug and prefill it with the provided value.    For example, if the slug is `my-field` and the URL contains `&my-field=value`,    the field will be prefilled with this value and disabled.
        options:
          example:
          - Option 1
          - Option 2
          type: array
          items:
            type: string
        type:
          type: string
          example: multiSelect
          enum:
          - multiSelect
          description: A list that allows multiple selections.
      required:
      - field
      - slug
      - label
      - required
      - hidden
      - disableOnPrefill
      - options
      - type
    CustomAddressFieldOutput_2026_06_12:
      type: object
      properties:
        field:
          type: string
          example: custom
          description: Identifies this as a custom booking field.
        slug:
          type: string
          description: Unique slug identifier for this custom field.
          example: some-slug
        label:
          type: string
          example: Your custom field label
        required:
          type: boolean
        hidden:
          type: boolean
          description: Hide this booking field from the booking page while keeping it in the event type's settings. Hidden fields are only returned to callers authorized on the event type.
        placeholder:
          type: string
        disableOnPrefill:
          type: boolean
          description: Disable this booking field if the URL contains query parameter with key equal to the slug and prefill it with the provided value.    For example, if the slug is `my-field` and the URL contains `&my-field=value`,    the field will be prefilled with this value and disabled.
        type:
          type: string
          example: address
          enum:
          - address
          description: An address input on the booking page.
      required:
      - field
      - slug
      - label
      - required
      - hidden
      - disableOnPrefill
      - type
    DisableReschedulingOutput_2024_06_14:
      type: object
      properties:
        disabled:
          type: boolean
          description: If true, rescheduling is always disabled for this event type.
          example: true
        minutesBefore:
          type: number
          minimum: 1
          description: Rescheduling is disabled when less than the specified number of minutes before the meeting.
          example: 60
    LinkOutput:
      type: object
      properties:
        lengthInMinutes:
          type: number
          example: 60
        lengthInMinutesOptions:
          example:
          - 15
          - 30
          - 60
          description: If you want that user can choose between different lengths of the event you can specify them here. Must include the provided `lengthInMinutes`.
          type: array
          items:
            type: number
        title:
          type: string
          example: Learn the secrets of masterchief!
        slug:
          type: string
          example: learn-the-secrets-of-masterchief
        description:
          type: string
          example: Discover the culinary wonders of Argentina by making the best flan ever!
        locations:
          type: array
          items:
            oneOf:
            - title: Address
              $ref: '#/components/schemas/OutputAddressLocation_2024_06_14'
            - title: Link
