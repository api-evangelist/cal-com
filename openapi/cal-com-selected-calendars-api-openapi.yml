openapi: 3.2.0
info:
  title: Cal.com API v2 Selected Calendars API
  description: ''
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Selected Calendars
paths:
  /v2/selected-calendars:
    post:
      description: If accessed using an OAuth access token, the `APPS_WRITE` scope is required.
      operationId: SelectedCalendarsController_addSelectedCalendar
      parameters:
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectedCalendarsInputDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectedCalendarOutputResponseDto'
      summary: Add a selected calendar
      tags:
      - Selected Calendars
      x-oauth-scopes:
      - APPS_WRITE
    delete:
      description: If accessed using an OAuth access token, the `APPS_WRITE` scope is required.
      operationId: SelectedCalendarsController_deleteSelectedCalendar
      parameters:
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      - name: integration
        required: true
        in: query
        schema:
          type: string
      - name: externalId
        required: true
        in: query
        schema:
          type: string
      - name: credentialId
        required: true
        in: query
        schema:
          type: string
      - name: delegationCredentialId
        required: false
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectedCalendarOutputResponseDto'
      summary: Delete a selected calendar
      tags:
      - Selected Calendars
      x-oauth-scopes:
      - APPS_WRITE
components:
  schemas:
    SelectedCalendarOutputDto:
      type: object
      properties:
        userId:
          type: number
        integration:
          type: string
        externalId:
          type: string
        credentialId:
          type:
          - number
          - 'null'
      required:
      - userId
      - integration
      - externalId
      - credentialId
    SelectedCalendarsInputDto:
      type: object
      properties:
        integration:
          type: string
        externalId:
          type: string
        credentialId:
          type: number
        delegationCredentialId:
          type: string
      required:
      - integration
      - externalId
      - credentialId
    SelectedCalendarOutputResponseDto:
      type: object
      properties:
        status:
          enum:
          - success
          - error
          type: string
          example: success
        data:
          $ref: '#/components/schemas/SelectedCalendarOutputDto'
      required:
      - status
      - data
