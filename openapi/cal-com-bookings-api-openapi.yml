    CreateInstantBookingInput_2024_08_13:
      type: object
      properties:
        start:
          type: string
          description: The start time of the booking in ISO 8601 format in UTC timezone.
          example: '2024-08-13T09:00:00Z'
          format: date-time
        attendee:
          description: The attendee's details.
          allOf:
          - $ref: '#/components/schemas/CreateBookingAttendee'
        bookingFieldsResponses:
          type: object
          additionalProperties: true
          description: Booking field responses consisting of an object with booking field slug as keys and user response as values for custom booking fields added by you.
          example:
            customField: customValue
        leadEnrichmentOptOut:
          type: boolean
          description: 'The booker''s answer to the lead enrichment opt-out, for an event type with a workflow that looks bookers up with lead enrichment. Send `true` when the booker ticked the opt-out and `false` when they were shown it and left it unticked. Sending `false` asserts that the booker saw the opt-out. Leave it out when the booker was not shown it: a booking without an answer is never looked up.'
          example: false
        eventTypeId:
          type: number
          description: The ID of the event type that is booked. Required unless eventTypeSlug and username are provided as an alternative to identifying the event type.
          example: 123
        eventTypeSlug:
          type: string
          description: The slug of the event type. Required along with username / teamSlug and optionally organizationSlug if eventTypeId is not provided.
          example: my-event-type
        username:
          type: string
          description: The username of the event owner. Required along with eventTypeSlug and optionally organizationSlug if eventTypeId is not provided.
          example: john-doe
        teamSlug:
          type: string
          description: Team slug for team that owns event type for which slots are fetched. Required along with eventTypeSlug and optionally organizationSlug if the team is part of organization
          example: john-doe
        organizationSlug:
          type: string
          description: The organization slug. Optional, only used when booking with eventTypeSlug + username, eventTypeSlug + teamSlug, or usernames.
          example: acme-corp
        guests:
          description: An optional list of guest emails attending the event.
          example:
          - guest1@example.com
          - guest2@example.com
          type: array
          items:
            type: string
        meetingUrl:
          type: string
          format: uri
          description: Deprecated - use 'location' instead. Meeting URL just for this booking. Displayed in email and calendar event. If not provided then cal video link will be generated.
          example: https://example.com/meeting
          deprecated: true
        location:
          description: One of the event type locations. If instead of passing one of the location objects as required by schema you are still passing a string please use an object.
          oneOf:
          - title: Address
            $ref: '#/components/schemas/BookingInputAddressLocation_2024_08_13'
          - title: Attendee Address
            $ref: '#/components/schemas/BookingInputAttendeeAddressLocation_2024_08_13'
          - title: Attendee Defined
            $ref: '#/components/schemas/BookingInputAttendeeDefinedLocation_2024_08_13'
          - title: Attendee Phone
            $ref: '#/components/schemas/BookingInputAttendeePhoneLocation_2024_08_13'
          - title: Integration
            $ref: '#/components/schemas/BookingInputIntegrationLocation_2024_08_13'
          - title: Link
            $ref: '#/components/schemas/BookingInputLinkLocation_2024_08_13'
          - title: Phone
            $ref: '#/components/schemas/BookingInputPhoneLocation_2024_08_13'
          - title: Organizer Default App
            $ref: '#/components/schemas/BookingInputOrganizersDefaultAppLocation_2024_08_13'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: You can store any additional data you want here. Metadata must have at most 50 keys, each key up to 40 characters, and string values up to 500 characters.
          example:
            key: value
        lengthInMinutes:
          type: number
          minimum: 1
          example: 30
          description: "If it is an event type that has multiple possible lengths that attendee can pick from, you can pass the desired booking length here.\n    If not provided then event type default length will be used for the booking."
        routing:
          description: Routing information from routing forms that determined the booking assignment. Both responseId and teamMemberIds are required if provided.
          example:
            responseId: 123
            teamMemberIds:
            - 101
            - 102
          allOf:
          - $ref: '#/components/schemas/Routing'
        emailVerificationCode:
          type: string
          description: Email verification code required when event type has email verification enabled.
          example: '123456'
        allowConflicts:
          type: boolean
          description: When true, availability conflict checks are bypassed for an authenticated user who has access through the existing event owner, host, assigned user, team admin or organization admin checks. Team- and organization-scoped keys are restricted to events in their stored team or organization. Otherwise this parameter is silently ignored. Only supported on the 2026-02-25 and 2026-05-01 API versions.
          example: true
        allowBookingOutOfBounds:
          type: boolean
          description: When true, booking time out-of-bounds checks are bypassed, allowing bookings outside the normally permitted scheduling window, for an authenticated user who has access through the existing event owner, host, assigned user, team admin or organization admin checks. Team- and organization-scoped keys are restricted to events in their stored team or organization. Otherwise this parameter is silently ignored. Only supported on the 2026-02-25 and 2026-05-01 API versions.
          example: true
        skipBookingLimits:
          type: boolean
          description: When true, booking limit checks (event type, team, and per-host count and duration limits) are bypassed for an authenticated user who has access through the existing event owner, host, assigned user, team admin or organization admin checks. Team- and organization-scoped keys are restricted to events in their stored team or organization. Otherwise this parameter is silently ignored. Only supported on the 2026-02-25 and 2026-05-01 API versions.
          example: true
        instant:
          type: boolean
          description: Flag indicating if the booking is an instant booking. Only available for team events.
          example: true
      required:
      - start
      - attendee
      - instant
