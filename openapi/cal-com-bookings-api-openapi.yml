  /v2/bookings/{bookingUid}/reassign:
    post:
      description: 'Reassigns the host of a round robin or managed event type booking. The provided authorization header refers to the owner of the booking.


        Without `userUuid` in the body, an available round robin host is picked automatically.


        With `userUuid`, the booking is reassigned to that user. For a **round robin** booking, the user must be one of the booking''s hosts and the booking keeps its `uid`. For a **managed event** booking, the user must be one of the users the managed event is assigned to — list them, along with their availability for the booking''s slot, with `GET /v2/bookings/{bookingUid}/reassignment-candidates`. Reassignment moves the booking onto the new host''s own child event type, so the original booking is cancelled and **the returned booking has a new `uid`** which you must store in place of the old one. Recurring managed bookings cannot be reassigned yet.


        Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        If accessed using an OAuth access token, the `BOOKING_WRITE` scope is required.'
      operationId: BookingsController_2026_02_25_reassignBooking
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-02-25.
        required: true
        schema:
          type: string
          example: '2026-02-25'
          default: '2026-02-25'
      - name: bookingUid
        required: true
        in: path
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: false
