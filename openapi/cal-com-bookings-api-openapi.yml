openapi: 3.2.0
info:
  title: Cal.com API v2 Bookings API
  description: ''
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Bookings
paths:
  /v2/bookings:
    post:
      description: 'POST /v2/bookings is used to create regular bookings, recurring bookings and instant bookings. The request bodies for all 3 are almost the same except:

        If eventTypeId in the request body is id of a regular event, then regular booking is created.


        If it is an id of a recurring event type, then recurring booking is created.


        Meaning that the request bodies are equal but the outcome depends on what kind of event type it is with the goal of making it as seamless for developers as possible.


        For team event types it is possible to create instant meeting. To do that just pass `"instant": true` to the request body.


        The start needs to be in UTC aka if the timezone is GMT+2 in Rome and meeting should start at 11, then UTC time should have hours 09:00 aka without time zone.


        Finally, there are 2 ways to book an event type belonging to an individual user:

        1. Provide `eventTypeId` in the request body.

        2. Provide `eventTypeSlug` and `username` and optionally `organizationSlug` if the user with the username is within an organization.


        And 2 ways to book and event type belonging to a team:

        1. Provide `eventTypeId` in the request body.

        2. Provide `eventTypeSlug` and `teamSlug` and optionally `organizationSlug` if the team with the teamSlug is within an organization.


        If you are creating a seated booking for an event type with ''show attendees'' disabled, then to retrieve attendees in the response either set ''show attendees'' to true on event type level or

        you have to provide an authentication method of event type owner, host, team admin or owner or org admin or owner.


        For event types that have SMS reminders workflow, you need to pass the attendee''s phone number in the request body via `attendee.phoneNumber` (e.g., "+19876543210" in international format). This is an optional field, but becomes required when SMS reminders are enabled for the event type. For the complete attendee object structure, see the attendee object documentation.


        Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.'
      operationId: BookingsController_2026_02_25_createBooking
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-02-25.
        required: true
        schema:
          type: string
          example: '2026-02-25'
          default: '2026-02-25'
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: false
        schema:
          type: string
      - name: x-cal-secret-key
        in: header
        description: For platform customers - OAuth client secret key
        required: false
        schema:
          type: string
      - name: x-cal-client-id
        in: header
        description: For platform customers - OAuth client ID
        required: false
        schema:
          type: string
      requestBody:
        required: true
        description: 'Accepts different types of booking input: Standard Booking, Instant Booking, or Recurring Booking.'
        content:
          application/json:
            schema:
              oneOf:
              - title: Standard Booking
                $ref: '#/components/schemas/CreateBookingInput_2024_08_13'
              - title: Instant Booking
                $ref: '#/components/schemas/CreateInstantBookingInput_2024_08_13'
              - title: Recurring Booking
                $ref: '#/components/schemas/CreateRecurringBookingInput_2024_08_13'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBookingOutput_2024_08_13'
      summary: Create a booking
      tags:
      - Bookings
      x-oauth-scopes: []
    get:
      description: 'Cursor-based pagination. Pass the `pagination.nextCursor` from the previous response as the `cursor` query parameter to fetch the next page. Omit `cursor` to fetch the first page. `pagination.hasMore` is `false` and `pagination.nextCursor` is `null` when you''ve reached the last page.


        Must pass `cal-api-version: 2026-05-01` header.


        **`status` filters to a single status.** Pass one (e.g. `?status=upcoming`) or omit to walk all statuses. To list bookings across multiple statuses, issue parallel requests — one per status — and merge client-side.


        The sort direction and the page-1 anchor are derived from `status`:


        | `status` | Sort | Walk direction | Page-1 anchor (uuid bound) |

        |---|---|---|---|

        | _(omitted)_ | `Booking.uuid DESC` | Backward from far-future | upper bound at year 2100 |

        | `upcoming` | `Booking.uuid ASC` | Forward in time | lower bound at `NOW() − 1h` |

        | `recurring` | `Booking.uuid ASC` | Forward in time | lower bound at `NOW() − 1h` |

        | `unconfirmed` | `Booking.uuid ASC` | Forward in time | lower bound at `NOW() − 1h` |

        | `past` | `Booking.uuid DESC` | Backward in time | upper bound at `NOW()` |

        | `cancelled` | `Booking.uuid DESC` | Backward from far-future | upper bound at year 2100 |


        If accessed using an OAuth access token, the `BOOKING_READ` scope is required.'
      operationId: BookingsController_2026_05_01_getBookings
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-05-01.
        required: true
        schema:
          type: string
          example: '2026-05-01'
          default: '2026-05-01'
      - name: status
        required: false
        in: query
        description: Filter bookings by a single status. Pass one (e.g. `?status=upcoming`) or omit to walk all statuses ordered by `Booking.uuid DESC`. To list bookings across multiple statuses, issue parallel requests, one per status.
        schema:
          example: upcoming
          type: string
          enum:
          - upcoming
          - recurring
          - past
          - cancelled
          - unconfirmed
      - name: attendeeEmail
        required: false
        in: query
        description: Filter bookings by the attendee's email address.
        schema:
          example: example@domain.com
          type: string
      - name: attendeeName
        required: false
        in: query
        description: Filter bookings by the attendee's name.
        schema:
          example: John Doe
          type: string
      - name: bookingUid
        required: false
        in: query
        description: Filter bookings by the booking Uid.
        schema:
          example: 2NtaeaVcKfpmSZ4CthFdfk
          type: string
      - name: eventTypeIds
        required: false
        in: query
        description: Filter bookings by event type ids. Event type ids must be separated by a comma.
        schema:
          minItems: 1
          example: ?eventTypeIds=100,200
          type: string
      - name: eventTypeId
        required: false
        in: query
        description: Filter bookings by event type id.
        schema:
          example: ?eventTypeId=100
          type: string
      - name: teamsIds
        required: false
        in: query
        description: Filter bookings by team ids that user is part of. Team ids must be separated by a comma.
        schema:
          minItems: 1
          example: ?teamIds=50,60
          type: string
      - name: teamId
        required: false
        in: query
        description: Filter bookings by team id that user is part of
        schema:
          example: ?teamId=50
          type: string
      - name: afterStart
        required: false
        in: query
        description: Filter bookings with start after this date string.
        schema:
          example: ?afterStart=2025-03-07T10:00:00.000Z
          type: string
      - name: beforeEnd
        required: false
        in: query
        description: Filter bookings with end before this date string.
        schema:
          example: ?beforeEnd=2025-03-07T11:00:00.000Z
          type: string
      - name: afterCreatedAt
        required: false
        in: query
        description: Filter bookings that have been created after this date string.
        schema:
          example: ?afterCreatedAt=2025-03-07T10:00:00.000Z
          type: string
      - name: beforeCreatedAt
        required: false
        in: query
        description: Filter bookings that have been created before this date string.
        schema:
          example: ?beforeCreatedAt=2025-03-14T11:00:00.000Z
          type: string
      - name: afterUpdatedAt
        required: false
        in: query
        description: Filter bookings that have been updated after this date string.
        schema:
          example: ?afterUpdatedAt=2025-03-07T10:00:00.000Z
          type: string
      - name: beforeUpdatedAt
        required: false
        in: query
        description: Filter bookings that have been updated before this date string.
        schema:
          example: ?beforeUpdatedAt=2025-03-14T11:00:00.000Z
          type: string
      - name: sortStart
        required: false
        in: query
        description: Sort results by their start time in ascending or descending order.
        schema:
          example: ?sortStart=asc OR ?sortStart=desc
          type: string
          enum:
          - asc
          - desc
      - name: sortEnd
        required: false
        in: query
        description: Sort results by their end time in ascending or descending order.
        schema:
          example: ?sortEnd=asc OR ?sortEnd=desc
          type: string
          enum:
          - asc
          - desc
      - name: sortCreated
        required: false
        in: query
        description: Sort results by their creation time (when booking was made) in ascending or descending order.
        schema:
          example: ?sortCreated=asc OR ?sortCreated=desc
          type: string
          enum:
          - asc
          - desc
      - name: sortUpdatedAt
        required: false
        in: query
        description: Sort results by their updated time (for example when booking status changes) in ascending or descending order.
        schema:
          example: ?sortUpdatedAt=asc OR ?sortUpdatedAt=desc
          type: string
          enum:
          - asc
          - desc
      - name: cursor
        required: false
        in: query
        description: Opaque cursor for cursor-based pagination. Pass the `pagination.nextCursor` value from a previous response to fetch the next page. Omit to fetch the first page.
        schema:
          example: eyJ2IjoxLCJzb3J0VXVpZCI6IjAxOGY0YzJlLTNmMWEtN2FiYy05ZGVmLTAxMjM0NTY3ODlhYiJ9
          type: string
      - name: limit
        required: false
        in: query
        description: The number of items to return
        schema:
          minimum: 1
          maximum: 100
          default: 50
          example: 50
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBookingsOutput_2026_05_01'
      summary: Get all bookings
      tags:
      - Bookings
      x-oauth-scopes:
      - BOOKING_READ
  /v2/bookings/by-seat/{seatUid}:
    get:
      description: 'Get a seated booking by its seat reference UID. This is useful when you have a seatUid from a seated booking and want to retrieve the full booking details.


        Cancelled seats remain resolvable by the same seatUid: the parent booking is returned and the matching attendee is tagged with status `cancelled`. Only that attendee is listed — remaining live attendees are not mixed in. Occupied-seat counts on GET /bookings/:uid are unchanged.


        A seat reschedule that keeps the same seatUid still resolves from the live row.


        If you are fetching a seated booking for an event type with ''show attendees'' disabled, then to retrieve attendees in the response either set ''show attendees'' to true on event type level or

        you have to provide an authentication method of event type owner, host, team admin or owner or org admin or owner.


        Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.'
      operationId: BookingsController_2026_02_25_getBookingBySeatUid
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-02-25.
        required: true
        schema:
          type: string
          example: '2026-02-25'
          default: '2026-02-25'
      - name: seatUid
        required: true
        in: path
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: false
        schema:
          type: string
      - name: x-cal-secret-key
        in: header
        description: For platform customers - OAuth client secret key
        required: false
        schema:
          type: string
      - name: x-cal-client-id
        in: header
        description: For platform customers - OAuth client ID
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBookingOutput_2024_08_13'
      summary: Get a booking by seat UID
      tags:
      - Bookings
      x-oauth-scopes: []
  /v2/bookings/{bookingUid}:
    get:
      description: '`:bookingUid` can be


        1. uid of a normal booking


        2. uid of one of the recurring booking recurrences


        3. uid of recurring booking which will return an array of all recurring booking recurrences (stored as recurringBookingUid on one of the individual recurrences).


        If you are fetching a seated booking for an event type with ''show attendees'' disabled, then to retrieve attendees in the response either set ''show attendees'' to true on event type level or

        you have to provide an authentication method of event type owner, host, team admin or owner or org admin or owner.


        Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.'
      operationId: BookingsController_2026_02_25_getBooking
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-02-25.
        required: true
        schema:
          type: string
          example: '2026-02-25'
          default: '2026-02-25'
      - name: bookingUid
        required: true
        in: path
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: false
        schema:
          type: string
      - name: x-cal-secret-key
        in: header
        description: For platform customers - OAuth client secret key
        required: false
        schema:
          type: string
      - name: x-cal-client-id
        in: header
        description: For platform customers - OAuth client ID
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBookingOutput_2024_08_13'
      summary: Get a booking
      tags:
      - Bookings
      x-mcp:
        name: get_booking
        guidance: Get a specific booking by its UID (use get_bookings to find UIDs). Returns full details including attendees, location, and metadata.
      x-oauth-scopes: []
  /v2/bookings/{bookingUid}/recordings:
    get:
      description: 'Fetches all the recordings for the booking `:bookingUid`. Requires authentication and proper authorization. Access is granted to the booking organizer and hosts, and to team or organization members whose role can view the booking and has the `booking.readRecordings` permission, which team and organization admins and owners have by default.


        Recording download links are valid for 1 hour only. Make a new request to generate fresh links after expiration.


        cal-api-version: `2026-02-25` is required in the request header.


        If accessed using an OAuth access token, the `BOOKING_READ` scope is required.'
      operationId: BookingsController_2026_02_25_getBookingRecordings
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-02-25.
        required: true
        schema:
          type: string
          example: '2026-02-25'
          default: '2026-02-25'
      - name: bookingUid
        required: true
        in: path
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBookingRecordingsOutput'
        '429':
          description: Rate limit exceeded. Please try again. The `Retry-After` response header carries the number of seconds to wait before retrying.
      summary: Get all the recordings for the booking
      tags:
      - Bookings
      x-oauth-scopes:
      - BOOKING_READ
  /v2/bookings/{bookingUid}/transcripts:
    get:
      description: 'Fetches all the transcript download links for the booking `:bookingUid`. Requires authentication and proper authorization. Access is granted to the booking organizer and hosts, and to team or organization members whose role can view the booking and has the `booking.readRecordings` permission, which team and organization admins and owners have by default.


        Transcripts are generated when clicking "Transcribe" during a Cal Video meeting. Download links are valid for 1 hour only - make a new request to generate fresh links after expiration.


        Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        If accessed using an OAuth access token, the `BOOKING_READ` scope is required.'
      operationId: BookingsController_2026_02_25_getBookingTranscripts
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-02-25.
        required: true
        schema:
          type: string
          example: '2026-02-25'
          default: '2026-02-25'
      - name: bookingUid
        required: true
        in: path
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBookingTranscriptsOutput'
        '429':
          description: Conferencing provider rate limit exceeded. Try again later. The `Retry-After` response header carries the number of seconds to wait before retrying.
      summary: Get Cal Video real time transcript download links for the booking
      tags:
      - Bookings
      x-oauth-scopes:
      - BOOKING_READ
  /v2/bookings/{bookingUid}/reschedule:
    post:
      description: 'Reschedule a booking or seated booking.


        Reschedulable booking statuses:

        - `accepted` — the confirmed booking is moved to the new start time.

        - `pending` — a booking awaiting host confirmation can be rescheduled. The new booking stays `pending` until the host confirms or declines it.


        Non-reschedulable booking statuses (endpoint responds with `400 Bad Request`):

        - `cancelled` — the booking has already been cancelled. If it was cancelled because it was previously rescheduled, the error message includes the UID of the booking it was rescheduled to.

        - `rejected` — the host declined the original confirmation-required request. Create a new booking instead.

        - `awaiting_host` — an instant meeting that is live and waiting for a host to join. Create a new booking instead.


        Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.'
      operationId: BookingsController_2026_02_25_rescheduleBooking
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-02-25.
        required: true
        schema:
          type: string
          example: '2026-02-25'
          default: '2026-02-25'
      - name: bookingUid
        required: true
        in: path
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: false
        schema:
          type: string
      - name: x-cal-secret-key
        in: header
        description: For platform customers - OAuth client secret key
        required: false
        schema:
          type: string
      - name: x-cal-client-id
        in: header
        description: For platform customers - OAuth client ID
        required: false
        schema:
          type: string
      requestBody:
        required: true
        description: "Accepts different types of reschedule booking input: Standard or Recurring Booking, or Seated Booking. If you're rescheduling a seated booking as org admin of booking host, pass booking input for Standard or Recurring Booking along with your access token in the request header.\n\n      If you are rescheduling a seated booking for an event type with 'show attendees' disabled, then to retrieve attendees in the response either set 'show attendees' to true on event type level or\n      you have to provide an authentication method of event type owner, host, team admin or owner or org admin or owner."
        content:
          application/json:
            schema:
              oneOf:
              - title: Standard or Recurring Booking
                $ref: '#/components/schemas/RescheduleBookingInput_2024_08_13'
              - title: Seated Booking
                $ref: '#/components/schemas/RescheduleSeatedBookingInput_2024_08_13'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescheduleBookingOutput_2024_08_13'
      summary: Reschedule a booking
      tags:
      - Bookings
      x-oauth-scopes: []
  /v2/bookings/{bookingUid}/cancel:
    post:
      description: ':bookingUid can be :bookingUid of an usual booking, individual recurrence or recurring booking to cancel all recurrences.


        Cancelling normal bookings:

        If the booking is not seated and not recurring, simply pass :bookingUid in the request URL `/bookings/:bookingUid/cancel` and optionally cancellationReason in the request body `{"cancellationReason": "Will travel"}`.


        Cancelling seated bookings:

        It is possible to cancel specific seat within a booking as an attendee or all of the seats as the host.


        1. As an attendee - provide :bookingUid in the request URL `/bookings/:bookingUid/cancel` and seatUid in the request body `{"seatUid": "123-123-123"}` . This will remove this particular attendance from the booking.


        2. As the host or org admin of host - host can cancel booking for all attendees aka for every seat, this also applies to org admins. Provide :bookingUid in the request URL `/bookings/:bookingUid/cancel` and cancellationReason in the request body `{"cancellationReason": "Will travel"}` and `Authorization: Bearer token` request header where token is event type owner (host) credential. This will cancel the booking for all attendees.


        Cancelling recurring seated bookings:

        For recurring seated bookings it is not possible to cancel all of them with 1 call

        like with non-seated recurring bookings by providing recurring bookind uid - you have to cancel each recurrence booking by its bookingUid + seatUid.


        If you are cancelling a seated booking for an event type with ''show attendees'' disabled, then to retrieve attendees in the response either set ''show attendees'' to true on event type level or

        you have to provide an authentication method of event type owner, host, team admin or owner or org admin or owner.


        Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.'
      operationId: BookingsController_2026_02_25_cancelBooking
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-02-25.
        required: true
        schema:
          type: string
          example: '2026-02-25'
          default: '2026-02-25'
      - name: bookingUid
        required: true
        in: path
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: false
        schema:
          type: string
      - name: x-cal-secret-key
        in: header
        description: For platform customers - OAuth client secret key
        required: false
        schema:
          type: string
      - name: x-cal-client-id
        in: header
        description: For platform customers - OAuth client ID
        required: false
        schema:
          type: string
      requestBody:
        required: true
        description: 'Accepts different types of cancel booking input: Standard or Recurring Booking (for normal or recurring bookings) or Seated Booking (for seated bookings)'
        content:
          application/json:
            schema:
              oneOf:
              - title: Standard or Recurring Booking
                $ref: '#/components/schemas/CancelBookingInput_2024_08_13'
              - title: Seated Booking
                $ref: '#/components/schemas/CancelSeatedBookingInput_2024_08_13'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelBookingOutput_2024_08_13'
      summary: Cancel a booking
      tags:
      - Bookings
      x-oauth-scopes: []
  /v2/bookings/{bookingUid}/mark-absent:
    post:
      description: 'The provided authorization header refers to the owner of the booking.


        Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        If accessed using an OAuth access token, the `BOOKING_WRITE` scope is required.'
      operationId: BookingsController_2026_02_25_markNoShow
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-02-25.
        required: true
        schema:
          type: string
          example: '2026-02-25'
          default: '2026-02-25'
      - name: bookingUid
        required: true
        in: path
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAbsentBookingInput_2024_08_13'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAbsentBookingOutput_2024_08_13'
      summary: Mark a booking absence
      tags:
      - Bookings
      x-mcp:
        name: mark_booking_absent
