  /v2/bookings/{bookingUid}/conferencing-sessions:
    get:
      description: 'Requires authentication and proper authorization. Access is granted to the booking organizer and hosts, and to team or organization members whose role can view the booking and has the `booking.readRecordings` permission, which team and organization admins and owners have by default.


        cal-api-version: `2026-02-25` is required in the request header.


        This endpoint is rate-limited to 60 requests per minute per caller (per API key, access token, OAuth client, or IP). Exceeding the limit returns a 429 response and blocks further calls for 60 seconds.


        If the upstream conferencing provider rate-limits the request, this endpoint responds with HTTP 429 and a `Retry-After` header carrying the number of seconds to wait before retrying. Clients should honor this hint.


        If accessed using an OAuth access token, the `BOOKING_READ` scope is required.'
      operationId: BookingsController_2026_02_25_getVideoSessions
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-02-25.
        required: true
        schema:
          type: string
          example: '2026-02-25'
          default: '2026-02-25'
      - name: bookingUid
        required: true
        in: path
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBookingVideoSessionsOutput'
        '429':
          description: Rate limit exceeded — either the per-caller throttle or the upstream conferencing provider. The `Retry-After` response header carries the number of seconds to wait before retrying.
      summary: Get Video Meeting Sessions. Only supported for Cal Video
      tags:
      - Bookings
      x-oauth-scopes:
      - BOOKING_READ
