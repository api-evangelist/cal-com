    RescheduleBookingInput_2024_08_13:
      type: object
      properties:
        start:
          type: string
          description: Start time in ISO 8601 format for the new booking
          example: '2024-08-13T10:00:00Z'
          format: date-time
        lengthInMinutes:
          type: number
          minimum: 1
          example: 30
          description: If the event type has multiple possible lengths, you can pass the new booking length here. If not provided then the original booking length is kept.
        rescheduledBy:
          type: string
          description: 'Email of the person who is rescheduling the booking - only needed when rescheduling a booking that requires a confirmation.

            If event type owner email is provided then rescheduled booking will be automatically confirmed. If attendee email or no email is passed then the event type

            owner will have to confirm the rescheduled booking.'
        reschedulingReason:
          type: string
          example: User requested reschedule
          description: Reason for rescheduling the booking
        emailVerificationCode:
          type: string
          description: Email verification code required when event type has email verification enabled.
          example: '123456'
        rescheduleWithSameHost:
          type: boolean
          description: Only for round robin event types that let the person rescheduling choose the host. True keeps the original host, false lets round robin pick from the whole team. Ignored for every other event type.
          example: true
        allowConflicts:
          type: boolean
          description: When true, availability conflict checks are bypassed for an authenticated user who has access through the existing event owner, host, assigned user, team admin or organization admin checks. Team- and organization-scoped keys are restricted to events in their stored team or organization. Otherwise this parameter is silently ignored. Only supported on the 2026-02-25 and 2026-05-01 API versions.
          example: true
        allowBookingOutOfBounds:
          type: boolean
          description: When true, booking time out-of-bounds checks are bypassed, allowing bookings outside the normally permitted scheduling window, for an authenticated user who has access through the existing event owner, host, assigned user, team admin or organization admin checks. Team- and organization-scoped keys are restricted to events in their stored team or organization. Otherwise this parameter is silently ignored. Only supported on the 2026-02-25 and 2026-05-01 API versions.
          example: true
        skipBookingLimits:
          type: boolean
          description: When true, booking limit checks (event type, team, and per-host count and duration limits) are bypassed for an authenticated user who has access through the existing event owner, host, assigned user, team admin or organization admin checks. Team- and organization-scoped keys are restricted to events in their stored team or organization. Otherwise this parameter is silently ignored. Only supported on the 2026-02-25 and 2026-05-01 API versions.
          example: true
