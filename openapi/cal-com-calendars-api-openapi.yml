openapi: 3.2.0
info:
  title: Cal.com API v2 Calendars API
  description: ''
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Calendars
paths:
  /v2/calendars/ics-feed/save:
    post:
      description: If accessed using an OAuth access token, the `APPS_WRITE` scope is required.
      operationId: CalendarsController_createIcsFeed
      parameters:
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIcsFeedInputDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIcsFeedOutputResponseDto'
      summary: Save an ICS feed
      tags:
      - Calendars
      x-oauth-scopes:
      - APPS_WRITE
  /v2/calendars/ics-feed/check:
    get:
      description: If accessed using an OAuth access token, the `APPS_READ` scope is required.
      operationId: CalendarsController_checkIcsFeed
      parameters:
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      summary: Check an ICS feed
      tags:
      - Calendars
      x-oauth-scopes:
      - APPS_READ
  /v2/calendars/busy-times:
    get:
      description: 'Get busy times from a calendar. Example request URL is `https://api.cal.com/v2/calendars/busy-times?timeZone=Europe%2FMadrid&dateFrom=2024-12-18&dateTo=2024-12-18&calendar=135,skrauciz%40gmail.com&calendar=200,bob%40gmail.com`.


        The `calendar` query parameter identifies one calendar as `,`, e.g. `calendar=135,alice@example.com`. Both values are returned for each connected calendar by `GET /v2/calendars`. To load busy times from multiple calendars, pass the `calendar` query parameter multiple times, e.g. `calendar=135,alice@example.com&calendar=200,bob@example.com`. Only the first comma separates the two values, so an `externalId` containing commas is kept intact.


        Note: loggedInUsersTz is deprecated, use timeZone instead. If accessed using an OAuth access token, the `APPS_READ` scope is required.'
      operationId: CalendarsController_getBusyTimes
      parameters:
      - name: loggedInUsersTz
        required: false
        in: query
        deprecated: true
        description: 'Deprecated: Use timeZone instead. The timezone of the user represented as a string'
        schema:
          example: America/New_York
          type: string
      - name: timeZone
        required: false
        in: query
        description: The timezone for the busy times query represented as a string
        schema:
          example: America/New_York
          type: string
      - name: dateFrom
        required: true
        in: query
        description: The starting date for the busy times query
        schema:
          example: '2023-10-01'
          type: string
      - name: dateTo
        required: true
        in: query
        description: The ending date for the busy times query
        schema:
          example: '2023-10-31'
          type: string
      - name: calendar
        required: false
        in: query
        description: Calendar to load busy times from, formatted as credentialId,externalId. Repeat the parameter to load multiple calendars, e.g. calendar=135,alice@example.com&calendar=200,bob@example.com. At least one calendar is required.
        schema:
          example:
          - 135,alice@example.com
          type: array
          items:
            type: string
            pattern: ^\d+,.+$
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBusyTimesOutput'
      summary: Get busy times
      tags:
      - Calendars
      x-oauth-scopes:
      - APPS_READ
  /v2/calendars:
    get:
      description: If accessed using an OAuth access token, the `APPS_READ` scope is required.
      operationId: CalendarsController_getCalendars
      parameters:
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedCalendarsOutput'
      summary: Get all calendars
      tags:
      - Calendars
      x-mcp:
        name: get_connected_calendars
        guidance: List all calendar integrations connected to the authenticated user's account. Returns each calendar's credentialId and externalId, which are required by get_busy_times. Also shows the user's destination calendar.
      x-oauth-scopes:
      - APPS_READ
  /v2/calendars/{calendar}/connect:
    get:
      description: If accessed using an OAuth access token, the `APPS_WRITE` scope is required.
      operationId: CalendarsController_redirect
      parameters:
      - name: Authorization
        required: true
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        schema:
          type: string
      - name: calendar
        required: true
        in: path
        schema:
          enum:
          - office365
          - google
          type: string
      - name: isDryRun
        required: true
        in: query
        schema:
          type: boolean
      - name: redir
        required: false
        in: query
        description: Redirect URL after successful calendar authorization.
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      summary: Get OAuth connect URL
      tags:
      - Calendars
      x-oauth-scopes:
      - APPS_WRITE
  /v2/calendars/{calendar}/save:
    get:
      operationId: CalendarsController_save
      parameters:
      - name: state
        required: true
        in: query
        schema:
          type: string
      - name: code
        required: true
        in: query
        schema:
          type: string
      - name: calendar
        required: true
        in: path
        schema:
          enum:
          - office365
          - google
          type: string
      responses:
        '200':
          description: ''
      summary: Save Google or Outlook calendar credentials
      tags:
      - Calendars
      x-oauth-scopes: []
  /v2/calendars/{calendar}/credentials:
    post:
      description: If accessed using an OAuth access token, the `APPS_WRITE` scope is required.
      operationId: CalendarsController_syncCredentials
      parameters:
      - name: calendar
        required: true
        in: path
        schema:
          enum:
          - apple
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCalendarCredentialsInput'
      responses:
        '201':
          description: ''
      summary: Save Apple calendar credentials
      tags:
      - Calendars
      x-oauth-scopes:
      - APPS_WRITE
  /v2/calendars/{calendar}/check:
    get:
      description: If accessed using an OAuth access token, the `APPS_READ` scope is required.
      operationId: CalendarsController_check
      parameters:
      - name: calendar
        required: true
        in: path
        schema:
          enum:
          - apple
          - google
          - office365
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      summary: Check a calendar connection
      tags:
      - Calendars
      x-oauth-scopes:
      - APPS_READ
  /v2/calendars/{calendar}/disconnect:
    post:
      description: If accessed using an OAuth access token, the `APPS_WRITE` scope is required.
      operationId: CalendarsController_deleteCalendarCredentials
      parameters:
      - name: calendar
        required: true
        in: path
        schema:
          enum:
          - apple
          - google
          - office365
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCalendarCredentialsInputBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedCalendarCredentialsOutputResponseDto'
      summary: Disconnect a calendar
      tags:
      - Calendars
      x-oauth-scopes:
      - APPS_WRITE
components:
  schemas:
    ConnectedCalendarsOutput:
      type: object
      properties:
        status:
          enum:
          - success
          - error
          type: string
          example: success
        data:
          $ref: '#/components/schemas/ConnectedCalendarsData'
      required:
      - status
      - data
    DeletedCalendarCredentialsOutputDto:
      type: object
      properties:
        id:
          type: number
        type:
          type: string
        userId:
          type:
          - number
          - 'null'
        teamId:
          type:
          - number
          - 'null'
        appId:
          type:
          - string
          - 'null'
        invalid:
          type:
          - boolean
          - 'null'
      required:
      - id
      - type
      - userId
      - teamId
      - appId
      - invalid
    GetBusyTimesOutput:
      type: object
      properties:
        status:
          enum:
          - success
          - error
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/BusyTimesOutput'
      required:
      - status
      - data
    CreateCalendarCredentialsInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - username
      - password
    BusyTimesOutput:
      type: object
      properties:
        start:
          format: date-time
          type: string
        end:
          format: date-time
          type: string
        source:
          type:
          - string
          - 'null'
      required:
      - start
      - end
    DestinationCalendar:
      type: object
      properties:
        id:
          type: number
        integration:
          type: string
        externalId:
          type: string
        primaryEmail:
          type:
          - string
          - 'null'
        userId:
          type:
          - number
          - 'null'
        eventTypeId:
          type:
          - number
          - 'null'
        credentialId:
          type:
          - number
          - 'null'
        delegationCredentialId:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        primary:
          type: boolean
        readOnly:
          type: boolean
        email:
          type: string
        integrationTitle:
          type: string
      required:
      - id
      - integration
      - externalId
      - primaryEmail
      - userId
      - eventTypeId
      - credentialId
    DeletedCalendarCredentialsOutputResponseDto:
      type: object
      properties:
        status:
          enum:
          - success
          - error
          type: string
          example: success
        data:
          $ref: '#/components/schemas/DeletedCalendarCredentialsOutputDto'
      required:
      - status
      - data
    DeleteCalendarCredentialsInputBodyDto:
      type: object
      properties:
        id:
          type: integer
          example: 10
          description: Credential ID of the calendar to delete, as returned by the /calendars endpoint
      required:
      - id
    Primary:
      type: object
      properties:
        externalId:
          type: string
        integration:
          type: string
        name:
          type: string
        primary:
          type:
          - boolean
          - 'null'
        readOnly:
          type: boolean
        email:
          type: string
        isSelected:
          type: boolean
        credentialId:
          type: number
        delegationCredentialId:
          type:
          - string
          - 'null'
      required:
      - externalId
      - primary
      - readOnly
      - isSelected
      - credentialId
    CreateIcsFeedOutput:
      type: object
      properties:
        id:
          type: number
          example: 1234567890
          description: The id of the calendar credential
        type:
          type: string
          example: ics-feed_calendar
          description: The type of the calendar
        userId:
          type:
          - integer
          - 'null'
          example: 1234567890
          description: The user id of the user that created the calendar
        teamId:
          type:
          - integer
          - 'null'
          example: 1234567890
          description: The team id of the user that created the calendar
        appId:
          type:
          - string
          - 'null'
          example: ics-feed
          description: The slug of the calendar
        invalid:
          type:
          - boolean
          - 'null'
          example: false
          description: Whether the calendar credentials are valid or not
      required:
      - id
      - type
      - userId
      - teamId
      - appId
      - invalid
    ConnectedCalendar:
      type: object
      properties:
        integration:
          $ref: '#/components/schemas/Integration'
        credentialId:
          type: number
        delegationCredentialId:
          type:
          - string
          - 'null'
        primary:
          $ref: '#/components/schemas/Primary'
        calendars:
          type: array
          items:
            $ref: '#/components/schemas/Calendar'
      required:
      - integration
      - credentialId
    LocationOption:
      type: object
      properties:
        label:
          type: string
          description: Display label for this location option
          example: Google Meet
        value:
          type: string
          description: Location type identifier
          example: integrations:google:meet
        icon:
          type: string
          description: Icon identifier for this location option
        disabled:
          type: boolean
          description: Whether this location option is disabled
          default: false
      required:
      - label
      - value
    ConnectedCalendarsData:
      type: object
      properties:
        connectedCalendars:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedCalendar'
        destinationCalendar:
          $ref: '#/components/schemas/DestinationCalendar'
      required:
      - connectedCalendars
      - destinationCalendar
    Calendar:
      type: object
      properties:
        externalId:
          type: string
          format: email
        integration:
          type: string
        name:
          type: string
          format: email
        primary:
          type:
          - boolean
          - 'null'
        readOnly:
          type: boolean
        email:
          type: string
          format: email
        isSelected:
          type: boolean
        credentialId:
          type: number
        delegationCredentialId:
          type:
          - string
          - 'null'
      required:
      - externalId
      - readOnly
      - isSelected
      - credentialId
    Integration:
      type: object
      properties:
        appData:
          type:
          - object
          - 'null'
        dirName:
          type: string
        __template:
          type: string
        name:
          type: string
        description:
          type: string
        installed:
          type: boolean
        type:
          type: string
        title:
          type: string
        variant:
          type: string
        category:
          type: string
        categories:
          type: array
          items:
            type: string
        logo:
          type: string
        publisher:
          type: string
        slug:
          type: string
        url:
          type: string
        email:
          type: string
        locationOption:
          description: Location option for this integration
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/LocationOption'
      required:
      - name
      - description
      - type
      - variant
      - categories
      - logo
      - publisher
      - slug
      - url
      - email
      - locationOption
    CreateIcsFeedOutputResponseDto:
      type: object
      properties:
        status:
          enum:
          - success
          - error
          type: string
          example: success
        data:
          $ref: '#/components/schemas/CreateIcsFeedOutput'
      required:
      - status
      - data
    CreateIcsFeedInputDto:
      type: object
      properties:
        urls:
          type: array
          minItems: 1
          example:
          - https://cal.com/ics/feed.ics
          description: An array of ICS URLs
          items:
            type: string
            example: https://cal.com/ics/feed.ics
        readOnly:
          type: boolean
          default: true
          example: false
          description: Whether to allowing writing to the calendar or not
      required:
      - urls
