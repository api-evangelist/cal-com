          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLocationsOutputResponseDto'
        '400':
          description: Invalid Event UUID or location id, a published paid Event, or a cancelled Event
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions, or a co-host removing a location
        '404':
          description: Event or location not found
        '409':
          description: The Event changed while the location was being removed
      summary: Remove a location from an Event
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
    patch:
      description: 'Changes the fields sent and keeps the rest of the location, including its `id`. `type` is required and must match the stored location; to change it, delete the location and add a new one. Pass null for `label`, `price` or `capacity` to remove it. A location returned as `type: "unknown"` can''t be edited.


        On a published Event, a location''s price and currency can''t change, and changing a location emails the guests. If the Event changes while the location is being saved, nothing is saved and 409 is returned.


        The authenticated user must be its owner, one of its hosts, an accepted co-host, or a member of the owning team; an accepted co-host can''t change a price. PBAC permission for team events: `calEvent.update`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `EVENT_WRITE` scope is required.'
      operationId: EventLocationsController_update
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: locationId
        required: true
        in: path
        description: The location's `id`, from `GET /v2/events/{uuid}/locations`.
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - title: Address
                $ref: '#/components/schemas/UpdateEventAddressLocationInput'
              - title: Link
                $ref: '#/components/schemas/UpdateEventLinkLocationInput'
              - title: Integration
                $ref: '#/components/schemas/UpdateEventIntegrationLocationInput'
              - title: Organizer Default App
                $ref: '#/components/schemas/UpdateEventOrganizersDefaultAppLocationInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLocationOutputResponseDto'
        '400':
          description: Invalid Event UUID, an invalid field, a different `type`, a price change on a published Event, or a cancelled Event
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions, or a co-host changing a price
        '404':
          description: Event or location not found
        '409':
          description: The Event changed while the location was being saved
      summary: Edit an Event's location
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
  /v2/events/{uuid}/person-avatar:
    post:
      description: 'Uploads a photo for a person in the Event''s lineup or schedule and returns its public URL, which you then set as that person''s `avatarUrl` when updating the Event. Uploading alone does not change the Event.


        Send the image as the multipart field `file`: JPEG, PNG or WebP, at most 2 MB and 2048 pixels on each side.


        The authenticated user must be the Event''s owner, one of its hosts, an accepted co-host, or a member of the owning team.


        PBAC permission for team events: `calEvent.update`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control.


        If accessed using an OAuth access token, the `EVENT_WRITE` scope is required.'
      operationId: EventPersonAvatarController_upload
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG or WebP image, at most 2 MB.
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPersonAvatarOutputResponseDto'
        '400':
          description: Invalid Event UUID, a missing file, an unsupported image type, or an unreadable image
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Event not found
        '413':
          description: The image exceeds 2 MB or 2048 pixels on a side
      summary: Upload an Event person avatar
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
  /v2/events/{uuid}/messages:
    post:
      description: 'Emails one segment of the Event''s guests, optionally narrowed to one location or to guests who did or did not check in. The message is queued and sent in the background; list the Event''s messages to follow its status. The authenticated user must be the Event''s owner, one of its hosts, or a member of the owning team. Co-hosts cannot message guests. PBAC permission for team events: `calEvent.update`. If accessed using an OAuth access token, the `EVENT_WRITE` scope is required.'
      operationId: EventMessagesController_sendMessage
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageOutputResponseDto'
        '400':
          description: Invalid Event UUID or body, the segment has no guests to email, or the Event no longer accepts messages
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Event not found
        '429':
          description: Rate limit exceeded
      summary: Message an Event's guests
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
    get:
      description: 'Returns the Event''s messages, newest first, with their delivery status. The authenticated user must be the Event''s owner, one of its hosts, or a member of the owning team. Co-hosts cannot message guests. PBAC permission for team events: `calEvent.update`. Cursor-based pagination: pass `pagination.nextCursor` from a previous response as the `cursor` query parameter to fetch the next page; omit `cursor` for the first page. If accessed using an OAuth access token, the `EVENT_READ` scope is required.'
      operationId: EventMessagesController_listMessages
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: cursor
        required: false
        in: query
        description: Opaque cursor for cursor-based pagination. Pass the `pagination.nextCursor` value from a previous response to fetch the next page. Omit to fetch the first page.
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesOutputResponseDto'
        '400':
          description: Invalid Event UUID, or invalid cursor
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Event not found
      summary: List the messages sent to an Event's guests
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_READ
  /v2/events/{uuid}/invitations:
    post:
      description: 'Emails an invitation to each address. Addresses that are already invited or registered are skipped, and the response reports what happened to every address. The Event must be published, not cancelled and not started yet, and the authenticated user must have a verified email. An Event holds at most 200 active invitations. The authenticated user must be the Event''s owner, one of its hosts, an accepted co-host, or a member of the owning team. PBAC permission for team events: `calEvent.update`. If accessed using an OAuth access token, the `EVENT_WRITE` scope is required.'
      operationId: EventInvitationsController_inviteGuests
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteGuestsInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteGuestsOutputResponseDto'
        '400':
          description: Invalid Event UUID or body, the Event is unpublished, cancelled or started, or the invitation limit is reached
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions, or the user's email is not verified
        '404':
          description: Event not found
        '429':
          description: Rate limit exceeded
      summary: Invite guests to an Event
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
components:
  schemas:
    EventBookingOutputDto:
      type: object
      properties:
        type:
          type: string
          enum:
          - event
          description: Discriminates this booking as a Cal Event attendee, as opposed to a regular booking.
        registrationId:
          type: string
          format: uuid
          description: The registration id. Pass this as `registrationId` to the check-in, approve and decline endpoints.
        name:
          type: string
        email:
          type: string
        phoneNumber:
          type:
          - string
          - 'null'
        status:
          enum:
          - PENDING_APPROVAL
          - WAITLISTED
          - PENDING_PAYMENT
          - PENDING_CONFIRMATION
          - OFFER_EXPIRED
          - CONFIRMED
          - DECLINED
          - CANCELLED
          type: string
        rsvpResponse:
          enum:
          - 'YES'
          - 'NO'
          - MAYBE
          type: string
        responses:
          type:
          - object
          - 'null'
          description: Registration-form answers.
        locationId:
          type:
          - string
          - 'null'
        createdAt:
          format: date-time
          type: string
        checkedInAt:
          format: date-time
          type:
          - string
          - 'null'
          description: When a door check-in was recorded.
        checkedInByUserId:
          type:
          - number
          - 'null'
          description: Host who recorded the door check-in.
        avatarUrl:
          type:
          - string
          - 'null'
          description: The guest's Cal.com profile photo when their email belongs to an account, otherwise an external avatar when one is found. `null` when neither exists.
        payment:
          description: The guest's payment. `null` when the guest has no payment, for example on a free Event.
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/EventBookingPaymentOutputDto'
        noShow:
          type: boolean
          description: Whether a host marked the guest as a no-show.
        decidedAt:
          format: date-time
          type:
          - string
          - 'null'
          description: When a host approved or declined the guest. `null` until a host decides.
      required:
      - type
      - registrationId
      - name
      - email
      - status
      - rsvpResponse
      - createdAt
      - noShow
    EventLineupOutput:
      type: object
      properties:
        title:
          type:
          - string
          - 'null'
        people:
          type: array
          items:
            $ref: '#/components/schemas/EventLineupPersonOutput'
      required:
      - title
      - people
    UndoCheckInOutcomeOutputDto:
      type: object
      properties:
        kind:
          enum:
          - undone
          - not_checked_in
          type: string
        registration:
          $ref: '#/components/schemas/RegistrationOutputDto'
      required:
      - kind
    EventScheduleItemOutput:
      type: object
      properties:
        startTime:
          format: date-time
          type:
          - string
          - 'null'
        endTime:
          format: date-time
          type:
          - string
          - 'null'
        timeLabel:
          type:
          - string
          - 'null'
        content:
          type: string
        people:
          type: array
          items:
            $ref: '#/components/schemas/EventSchedulePersonOutput'
      required:
      - startTime
      - endTime
      - timeLabel
      - content
      - people
    EventHostInput:
      type: object
      properties:
        userId:
          type: number
          minimum: 1
          example: 123
      required:
      - userId
    RegistrationRsvpCountsOutputDto:
      type: object
      properties:
        'yes':
          type: number
          description: Guests who answered Yes, in any status.
        'no':
          type: number
          description: Guests who answered No, in any status.
        maybe:
          type: number
          description: Guests who answered Maybe, in any status.
      required:
      - 'yes'
      - 'no'
      - maybe
    CustomPhoneFieldOutput_2026_06_12:
      type: object
      properties:
        field:
          type: string
          example: custom
          description: Identifies this as a custom booking field.
        slug:
          type: string
          description: Unique slug identifier for this custom field.
          example: some-slug
        label:
          type: string
          example: Your custom field label
        required:
          type: boolean
        hidden:
          type: boolean
          description: Hide this booking field from the booking page while keeping it in the event type's settings. Hidden fields are only returned to callers authorized on the event type.
        placeholder:
          type: string
        disableOnPrefill:
          type: boolean
          description: Disable this booking field if the URL contains query parameter with key equal to the slug and prefill it with the provided value.    For example, if the slug is `my-field` and the URL contains `&my-field=value`,    the field will be prefilled with this value and disabled.
        type:
          type: string
          example: phone
          enum:
          - phone
          description: A phone-number input on the booking page.
      required:
      - field
      - slug
      - label
      - required
      - hidden
      - disableOnPrefill
      - type
    EventLocationOutputResponseDto:
      type: object
      properties:
        status:
          enum:
          - success
          - error
          type: string
          example: success
        data:
          oneOf:
          - title: Address
            $ref: '#/components/schemas/EventAddressLocationOutput'
          - title: Link
            $ref: '#/components/schemas/EventLinkLocationOutput'
          - title: Integration
            $ref: '#/components/schemas/EventIntegrationLocationOutput'
          - title: Organizer Default App
            $ref: '#/components/schemas/EventOrganizersDefaultAppLocationOutput'
      required:
      - status
      - data
    CustomMultiSelectFieldOutput_2026_06_12:
      type: object
      properties:
        field:
          type: string
          example: custom
          description: Identifies this as a custom booking field.
        slug:
          type: string
          description: Unique slug identifier for this custom field.
          example: some-slug
        label:
          type: string
          example: Your custom field label
        required:
          type: boolean
        hidden:
          type: boolean
          description: Hide this booking field from the booking page while keeping it in the event type's settings. Hidden fields are only returned to callers authorized on the event type.
        placeholder:
          type: string
        disableOnPrefill:
          type: boolean
          description: Disable this booking field if the URL contains query parameter with key equal to the slug and prefill it with the provided value.    For example, if the slug is `my-field` and the URL contains `&my-field=value`,    the field will be prefilled with this value and disabled.
        options:
          example:
          - Option 1
          - Option 2
          type: array
          items:
            type: string
        type:
          type: string
          example: multiSelect
          enum:
          - multiSelect
          description: A list that allows multiple selections.
      required:
      - field
      - slug
      - label
      - required
      - hidden
      - disableOnPrefill
      - options
      - type
    CheckInOutcomeOutputDto:
      type: object
      properties:
        kind:
          enum:
          - checked_in
          - already_checked_in
          - not_confirmed
