    post:
      description: 'Invites an email address to co-host the Event and emails it a link to accept, valid for 7 days. See `GET /v2/events/{uuid}/co-hosts` for what a co-host can do.


        The new invitation joins the end of the co-host list; re-inviting an address that is already invited sends a fresh link and keeps its place, and re-inviting an accepted co-host changes nothing. Rate limited per user.


        The authenticated user must be its owner, one of its hosts, or a member of the owning team; an accepted co-host cannot invite and gets 404, exactly like an unknown uuid.


        PBAC permission for team events: `calEvent.update`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control.


