    CreateEventInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: The Event's title.
          example: Team offsite
          maxLength: 255
        startTime:
          type: string
          description: When the Event starts, in ISO 8601 format in UTC timezone. It must not be in the past.
          example: '2030-01-01T10:00:00.000Z'
        endTime:
          type: string
          description: When the Event ends, in ISO 8601 format in UTC timezone. It must be after `startTime`.
          example: '2030-01-01T11:00:00.000Z'
        timeZone:
          type: string
          description: The IANA time zone the Event's times are shown in.
          example: Europe/Berlin
        slug:
          type: string
          description: 'Public page slug (cal.com/{slug}): 10-100 lowercase letters, digits and hyphens. Generated from the title when omitted.'
          example: team-offsite-2030
        description:
          type:
          - string
          - 'null'
          description: What the Event is about, shown on its page.
          maxLength: 5000
        visibility:
          enum:
          - PUBLIC
          - UNLISTED
          type: string
          description: 'Once published: PUBLIC is listed on the owner''s page, UNLISTED only opens from its link. Defaults to PUBLIC.'
          default: PUBLIC
        capacity:
          type:
          - number
          - 'null'
          minimum: 1
          description: 'The most guests the Event can take. Omit or pass null for unlimited. Ignored once any location has its own `capacity`: the Event then takes the sum of the location capacities, or is unlimited if any location has none. The waitlist only opens when the Event or the chosen location is full, so it only works when capacity is set on the Event or on a location.'
          maximum: 100000
        waitlistEnabled:
          type: boolean
          description: Let guests join a waitlist when the Event is full. The waitlist only opens when the Event or the chosen location is full, so it only works when capacity is set on the Event or on a location.
          default: false
        paymentTimeoutMinutes:
          type:
          - number
          - 'null'
          minimum: 10
          maximum: 10080
          description: How many minutes a guest's seat is held while they pay. null uses the default of 10 minutes.
        requiresApproval:
          type: boolean
          description: Registrations wait for a host's approval.
          default: false
        showOrganizerEmail:
          type: boolean
          description: Show the organizer's email to guests.
          default: true
        guestList:
          enum:
          - hidden
          - names
          - count
          type: string
          description: Who guests can see on the Event's page. `names` lists them, `count` shows how many, `hidden` shows neither. Defaults to `names`.
          default: names
        showPresentedBy:
          type: boolean
          description: Show who the Event is presented by.
          default: true
        theme:
          enum:
          - light
          - dark
          type:
          - string
          - 'null'
          description: Default theme of the event page. null follows the visitor's system setting.
        background:
          description: Animated background of the event page.
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/EventBackgroundInput'
        lineup:
          description: Speakers or performers on the event page. Avatars need the Event uuid, so create people without avatarUrl and upload avatars with the person avatar endpoint afterwards.
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/EventLineupInput'
        schedule:
          description: Agenda on the event page. Each item has either a startTime or a timeLabel. Avatars need the Event uuid, so create people without avatarUrl and upload avatars with the person avatar endpoint afterwards.
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/EventScheduleItemInput'
        registrationFields:
          type: array
          description: The questions guests answer when they register.
          items:
            oneOf:
            - title: Default Full Name
              $ref: '#/components/schemas/SystemFullNameFieldInput_2026_06_12'
            - title: Default Split Name
              $ref: '#/components/schemas/SystemSplitNameFieldInput_2026_06_12'
            - title: Default Email
              $ref: '#/components/schemas/SystemEmailFieldInput_2026_06_12'
            - title: Default Location
              $ref: '#/components/schemas/SystemLocationFieldInput_2026_06_12'
            - title: Default Title
              $ref: '#/components/schemas/SystemTitleFieldInput_2026_06_12'
            - title: Default Notes
              $ref: '#/components/schemas/SystemNotesFieldInput_2026_06_12'
            - title: Default Guests
