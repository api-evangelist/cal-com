            - title: Workflow-added AI Agent Phone
              $ref: '#/components/schemas/SystemAiAgentPhoneFieldInput_2026_06_12'
            - title: Custom Email
              $ref: '#/components/schemas/CustomEmailFieldInput_2026_06_12'
            - title: Custom Phone
              $ref: '#/components/schemas/CustomPhoneFieldInput_2026_06_12'
            - title: Custom Address
              $ref: '#/components/schemas/CustomAddressFieldInput_2026_06_12'
            - title: Custom Short Text
              $ref: '#/components/schemas/CustomShortTextFieldInput_2026_06_12'
            - title: Custom Number
              $ref: '#/components/schemas/CustomNumberFieldInput_2026_06_12'
            - title: Custom Long Text
              $ref: '#/components/schemas/CustomLongTextFieldInput_2026_06_12'
            - title: Custom Select
              $ref: '#/components/schemas/CustomSelectFieldInput_2026_06_12'
            - title: Custom Multi-Select
              $ref: '#/components/schemas/CustomMultiSelectFieldInput_2026_06_12'
            - title: Custom Multiple Emails
              $ref: '#/components/schemas/CustomMultiEmailFieldInput_2026_06_12'
            - title: Custom Checkbox Group
              $ref: '#/components/schemas/CustomCheckboxGroupFieldInput_2026_06_12'
            - title: Custom Checkbox
              $ref: '#/components/schemas/CustomCheckboxFieldInput_2026_06_12'
            - title: Custom Radio Group
              $ref: '#/components/schemas/CustomRadioGroupFieldInput_2026_06_12'
            - title: Custom URL
              $ref: '#/components/schemas/CustomUrlFieldInput_2026_06_12'
        hosts:
          description: The Event's hosts. The creator is always a host and always listed first, even when not passed. Personal Events can only have the creator, so passing other ids returns a 400. On team Events every id must be an accepted team member, otherwise it returns a 400.
          type: array
          items:
            $ref: '#/components/schemas/EventHostInput'
        liveStreams:
          description: Links where people can watch the event live.
          maxItems: 5
          type: array
          items:
            $ref: '#/components/schemas/EventLiveStreamInput'
        price:
          type:
          - number
          - 'null'
          minimum: 1
          description: Price of the Event, in the currency's smallest unit. Only for Events without locations, which need at least one live stream; Events with locations are priced per location. On update, null makes the Event free. Check `paymentsEnabled` on the Event before setting it.
          example: 1500
        currency:
          enum:
          - usd
          - eur
          - gbp
          - cad
          - aud
          - chf
          - nzd
          - jpy
          - brl
          - mxn
          - inr
          - sgd
          - hkd
          - dkk
          - nok
          - sek
          - pln
          - czk
          - huf
          - ron
          - bgn
          - krw
          - thb
          - php
          - myr
          - idr
          - try
          - zar
          - aed
          - cop
          type:
          - string
          - 'null'
          description: Cal Pay currency code. Required when `price` is set.
          example: usd
        startTime:
          type: string
          description: When the Event starts, in ISO 8601 format in UTC timezone. It must be before `endTime`.
          example: '2030-01-01T10:00:00.000Z'
        slug:
          type: string
          description: 'Public page slug (cal.com/{slug}): 10-100 lowercase letters, digits and hyphens. It can''t change once the Event is published.'
          example: team-offsite-2030
        visibility:
          enum:
          - PUBLIC
          - UNLISTED
          type: string
          description: 'Once published: PUBLIC is listed on the owner''s page, UNLISTED only opens from its link.'
        capacity:
          type:
          - number
          - 'null'
          minimum: 1
          description: 'The most guests the Event can take. Pass null for unlimited. Ignored once any location has its own `capacity`: the Event then takes the sum of the location capacities, or is unlimited if any location has none. It can''t go below the number of confirmed guests.'
          maximum: 100000
        waitlistEnabled:
          type: boolean
          description: Let guests join a waitlist when the Event is full. The waitlist only opens when the Event or the chosen location is full, so it only works when capacity is set on the Event or on a location.
        requiresApproval:
          type: boolean
          description: Registrations wait for a host's approval.
        showOrganizerEmail:
          type: boolean
          description: Show the organizer's email to guests.
        guestList:
          enum:
          - hidden
          - names
          - count
          type: string
          description: Who guests can see on the Event's page. `names` lists them, `count` shows how many, `hidden` shows neither. It can't change once the Event is published.
        showPresentedBy:
          type: boolean
          description: Show who the Event is presented by.
        category:
          enum:
          - meetup
          - conference
          - music
          - sports
          type: string
          description: What kind of event it is.
