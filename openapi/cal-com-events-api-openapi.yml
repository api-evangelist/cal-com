          example: 1500
        currency:
          enum:
          - usd
          - eur
          - gbp
          - cad
          - aud
          - chf
          - nzd
          - jpy
          - brl
          - mxn
          - inr
          - sgd
          - hkd
          - dkk
          - nok
          - sek
          - pln
          - czk
          - huf
          - ron
          - bgn
          - krw
          - thb
          - php
          - myr
          - idr
          - try
          - zar
          - aed
          - cop
          type: string
          description: Cal Pay currency code. Required with `price` when the location has no currency yet.
          example: usd
        capacity:
          type:
          - number
