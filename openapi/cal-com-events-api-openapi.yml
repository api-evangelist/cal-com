  /v2/events/{uuid}/co-hosts:
    get:
      description: 'Returns the Event''s co-hosts in their display order, with pending and declined invitations alongside accepted co-hosts.


        Co-hosts are people invited by email to help run the Event without joining the owning team. Unlike hosts — the owner and the team members on the Event''s host roster, who can do everything — an accepted co-host can view and edit the Event''s details and manage its guests (invite, approve, check in), but cannot publish, cancel or delete the Event, change its pricing, or manage co-hosts. An invitation grants nothing until the invitee accepts it while signed in with the invited email address.


        The authenticated user must be the Event''s owner, one of its hosts, an accepted co-host, or a member of the owning team; an accepted co-host sees only the accepted co-hosts.


        PBAC permission for team events: `calEvent.read`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control.


        If accessed using an OAuth access token, the `EVENT_READ` scope is required.'
