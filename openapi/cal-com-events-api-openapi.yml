        registration:
          $ref: '#/components/schemas/RegistrationOutputDto'
        checkedInAt:
          format: date-time
          type: string
          description: Set only when `kind` is `already_checked_in`.
        status:
          enum:
          - PENDING_APPROVAL
          - WAITLISTED
          - PENDING_PAYMENT
          - PENDING_CONFIRMATION
          - OFFER_EXPIRED
          - CONFIRMED
          - DECLINED
          - CANCELLED
          type: string
          description: Set only when `kind` is `not_confirmed`.
