openapi: 3.2.0
info:
  title: Cal.com API v2 Events API
  description: ''
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Events
paths:
  /v2/events:
    get:
      description: 'Returns the Events the authenticated user hosts: Events they own, plus Events they have accepted a co-host invitation to. A co-hosted Event may be owned by a team, so a team-owned Event can appear here — but team-owned Events the user neither hosts nor co-hosts are not returned by this endpoint; list those with `GET /v2/teams/{teamId}/events`. Ordered by start time, newest first when `status` is omitted.


        Cursor-based pagination: pass `pagination.nextCursor` from a previous response as the `cursor` query parameter to fetch the next page; omit `cursor` for the first page. `pagination.hasMore` is `false` and `pagination.nextCursor` is `null` on the last page.


        Must pass `cal-api-version: 2026-05-01` (or later). Older versions use `take`/`skip` offset pagination.


        Events are fixed-date RSVP pages served at cal.com/{slug}; they are not event types (bookable meeting templates) or calendar events. If accessed using an OAuth access token, the `EVENT_READ` scope is required.'
      operationId: EventsController_listCursor
      parameters:
      - name: cursor
        required: false
        in: query
        description: Opaque cursor for cursor-based pagination. Pass the `pagination.nextCursor` value from a previous response to fetch the next page. Omit to fetch the first page.
        schema:
          example: eyJ2IjoyLCJzdGFydFRpbWUiOiIyMDMwLTAxLTAxVDAwOjAwOjAwLjAwMFoiLCJldmVudFR5cGVVdWlkIjoiMDE4ZjRjMmUtM2YxYS03YWJjLTlkZWYtMDEyMzQ1Njc4OWFiIn0
          type: string
      - name: limit
        required: false
        in: query
        description: Maximum number of Events to return.
        schema:
          minimum: 1
          maximum: 250
          default: 50
          example: 25
          type: number
      - name: slug
        required: false
        in: query
        description: Filter by the event's public page slug (cal.com/{slug}).
        schema:
          example: team-offsite
          type: string
      - name: status
        required: false
        in: query
        description: 'Filter events by lifecycle status. `draft`: not published and not cancelled, ordered soonest first. `upcoming`: published and not yet ended, or cancelled but not yet started, ordered soonest first. `past`: everything else, ordered latest first. Omit to return all statuses, newest first. When provided, `pagination.nextCursor` encodes the status — cursors from one status value cannot be used with another and return 400.'
        schema:
          example: upcoming
          type: string
          enum:
          - draft
          - upcoming
          - past
      - name: cal-api-version
        in: header
        description: Must be set to 2026-05-01 (or a later API version) for cursor pagination.
        required: true
        schema:
          type: string
          example: '2026-05-01'
          default: '2026-05-01'
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsCursorOutputResponseDto'
        '400':
          description: Invalid cursor
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
      summary: List Events (cursor pagination)
      tags:
      - Events
      x-mcp:
        name: get_events
        guidance: 'List the authenticated user''s Cal Events: fixed-date RSVP pages served at cal.com/{slug}, such as a workshop or meetup that guests register for. Events are NOT event types (bookable meeting templates; use get_event_types) and NOT calendar events or bookings. Use this when the user asks about their Events or RSVP pages, or to find an Event''s uuid for get_event. Returns Events the user owns or co-hosts, newest start time first; team-owned Events they do not host are not included. Supports limit (1-250, default 50) and filtering by slug; when pagination.hasMore is true, pass pagination.nextCursor as cursor to fetch the next page.'
      x-oauth-scopes:
      - EVENT_READ
    post:
      description: 'Creates a draft Event for the authenticated user. A draft is not public and nobody can register until it is published with `POST /v2/events/{uuid}/publish`. To create an Event owned by a team, use `POST /v2/teams/{teamId}/events`.


        `startTime` and `endTime` are ISO 8601 in UTC; `startTime` must not be in the past and `endTime` must be after `startTime`.


        `guestList` controls whether guests see names, a count, or neither. `locations` sets where the Event happens; set `price` and `currency` on a location to charge for that place.


        Events are fixed-date RSVP pages served at cal.com/{slug}; they are not event types (bookable meeting templates) or calendar events.


        Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `EVENT_WRITE` scope is required.'
      operationId: EventsController_create
      parameters:
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventInput'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOutputResponseDto'
        '400':
          description: Invalid input, or a start time in the past
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
      summary: Create an Event
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
  /v2/events/{uuid}:
    get:
      description: 'Returns one Event by UUID. The authenticated user must be its owner, one of its hosts, an accepted co-host, or a member of the owning team. PBAC permission for team events: `calEvent.read`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. Events are fixed-date RSVP pages served at cal.com/{slug}; they are not event types (bookable meeting templates) or calendar events. If accessed using an OAuth access token, the `EVENT_READ` scope is required.'
      operationId: EventsController_get
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOutputResponseDto'
        '400':
          description: Invalid Event UUID
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Event not found
      summary: Get an Event
      tags:
      - Events
      x-mcp:
        name: get_event
        guidance: Get one Cal Event (a fixed-date RSVP page served at cal.com/{slug}) by its uuid. Not for event types (use get_event_type with a numeric id) or calendar events. Use this when you already have the Event's uuid; otherwise call get_events first and never guess the uuid. An Event the user cannot access returns 404, the same as one that does not exist.
      x-oauth-scopes:
      - EVENT_READ
    patch:
      description: 'Updates the properties sent and leaves every other property as it is. Takes the same properties as `POST /v2/events` except `locations`, which have their own endpoints under `/v2/events/{uuid}/locations`.


        `hosts`, `liveStreams`, `registrationFields`, `lineup` and `schedule` replace the whole stored list. `lineup: null` removes the lineup. Pass `null` to `capacity` for unlimited guests.


        The slug and the guest list can''t change once the Event is published, and a cancelled Event can''t be updated. New times must keep every schedule item inside the Event. An accepted co-host can update the Event but not its hosts, slug or policies such as `visibility`, `guestList` or `requiresApproval`.


        The authenticated user must be its owner, one of its hosts, an accepted co-host, or a member of the owning team. PBAC permission for team events: `calEvent.update`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `EVENT_WRITE` scope is required.'
      operationId: EventsController_update
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOutputResponseDto'
        '400':
          description: Invalid input, an end time that is not after the start time, new times that leave a schedule item outside the Event, a slug change after publishing, or a cancelled Event
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions, a guest list change after publishing, or a co-host changing the hosts, slug or policies
        '404':
          description: Event not found
      summary: Update an Event
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
    delete:
      description: 'Removes an Event, its registrations and its occurrence booking. An upcoming published Event is cancelled first, notifying its guests, and disappears from listings immediately; it is permanently removed once those notices have gone out. An Event cancelled more than seven days earlier is removed at once. An ended Event that still has confirmed guests cannot be deleted, and a published paid Event cannot be deleted because its payment records are retained. The authenticated user must be its owner, one of its hosts, or a member of the owning team; an external co-host gets 404. PBAC permission for team events: `calEvent.delete`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `EVENT_WRITE` scope is required.'
      operationId: EventsController_delete
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteEventOutputResponseDto'
        '400':
          description: Invalid Event UUID, or the Event must be cancelled first
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Event not found
      summary: Delete an Event
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
  /v2/events/{uuid}/publish:
    post:
      description: 'Takes a draft Event live: its public page becomes reachable, guests can RSVP, the occurrence lands on the hosts'' calendars. Idempotent for an Event that is already published. A cancelled Event cannot be published. The authenticated user must be its owner, one of its hosts, or a member of the owning team; an external co-host gets 404, exactly like an unknown uuid. PBAC permission for team events: `calEvent.update`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `EVENT_WRITE` scope is required.'
      operationId: EventsController_publish
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOutputResponseDto'
        '400':
          description: Invalid Event UUID, a cancelled Event, or an Event that cannot be published as configured
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions, or the account must verify its email first
        '404':
          description: Event not found
      summary: Publish an Event
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
  /v2/events/{uuid}/cancel:
    post:
      description: 'Cancels a published Event and notifies every registered guest; paid registrations are refunded. The Event stays listed with `cancelledAt` set. Drafts cannot be cancelled (delete them instead) and neither can Events that already ended. The authenticated user must be its owner, one of its hosts, or a member of the owning team; an external co-host gets 404. PBAC permission for team events: `calEvent.update`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. If accessed using an OAuth access token, the `EVENT_WRITE` scope is required.'
      operationId: EventsController_cancel
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelEventInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOutputResponseDto'
        '400':
          description: Invalid Event UUID, a draft, or an Event that already ended
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Event not found
      summary: Cancel an Event
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
  /v2/events/{uuid}/bookings:
    get:
      description: 'Returns the Event''s guests in the statuses given by `status`, confirmed guests by default. A confirmed guest holds a seat on the Event''s occurrence booking, the same way `GET /v2/bookings` reads attendees; pass `status=PENDING_APPROVAL` to list the guests waiting for approval, `WAITLISTED` for the waitlist, or `PENDING_PAYMENT` for guests who have not paid yet. The authenticated user must be the Event''s owner, one of its hosts, an accepted co-host, or a member of the owning team. PBAC permission for team events: `calEvent.read`. Cursor-based pagination: pass `pagination.nextCursor` from a previous response as the `cursor` query parameter to fetch the next page; omit `cursor` for the first page. If accessed using an OAuth access token, the `EVENT_READ` scope is required.'
      operationId: EventRegistrationsController_listBookings
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: cursor
        required: false
        in: query
        description: Opaque cursor for cursor-based pagination. Pass the `pagination.nextCursor` value from a previous response to fetch the next page. Omit to fetch the first page.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Maximum number of guests to return.
        schema:
          minimum: 1
          maximum: 250
          default: 50
          example: 25
          type: number
      - name: status
        required: false
        in: query
        description: Filter by registration status. Separate several statuses with a comma. Defaults to confirmed guests only.
        schema:
          minItems: 1
          default:
          - CONFIRMED
          example: ?status=PENDING_APPROVAL,WAITLISTED
          type: array
          items:
            type: string
            enum:
            - PENDING_APPROVAL
            - WAITLISTED
            - PENDING_PAYMENT
            - PENDING_CONFIRMATION
            - OFFER_EXPIRED
            - CONFIRMED
            - DECLINED
            - CANCELLED
      - name: rsvpResponse
        required: false
        in: query
        description: Filter by the guest's RSVP response.
        schema:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - MAYBE
      - name: search
        required: false
        in: query
        description: Filter by guest name or email, case-insensitive substring match.
        schema:
          maxLength: 255
          type: string
      - name: locationId
        required: false
        in: query
        description: Filter by the location the guest registered for.
        schema:
          maxLength: 128
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBookingsOutputResponseDto'
        '400':
          description: Invalid Event UUID, cursor or status
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Event not found
      summary: List an Event's bookings
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_READ
  /v2/events/{uuid}/registrations/{registrationId}/check-in:
    post:
      description: 'Records a door check-in for one registration, the roster''s manual tap (no QR involved). Same access as approving/declining guests — an external co-host may also work the door. PBAC permission for team events: `calEvent.update`. If accessed using an OAuth access token, the `EVENT_WRITE` scope is required.'
      operationId: EventRegistrationsController_checkInById
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: registrationId
        required: true
        in: path
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInOutcomeOutputResponseDto'
        '400':
          description: Invalid Event or registration UUID, or check-in is closed
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Event or registration not found
        '429':
          description: Rate limit exceeded
      summary: Check in a guest by registration id
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
    delete:
      description: 'Clears a mistaken door check-in. Idempotent: undoing an unchecked registration is a no-op report. Not gated by the event''s check-in window — undo corrects the host''s own record rather than recording attendance. PBAC permission for team events: `calEvent.update`. If accessed using an OAuth access token, the `EVENT_WRITE` scope is required.'
      operationId: EventRegistrationsController_undoCheckIn
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: registrationId
        required: true
        in: path
        schema:
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoCheckInOutcomeOutputResponseDto'
        '400':
          description: Invalid Event or registration UUID
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Event or registration not found
        '429':
          description: Rate limit exceeded
      summary: Undo a guest's check-in
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
  /v2/events/{uuid}/check-ins:
    post:
      description: 'Redeems a scanned check-in QR token. The token is carried in the request body, never the URL, since URLs land in history and access logs. Same access as the by-id check-in; an external co-host may also work the door. PBAC permission for team events: `calEvent.update`. If accessed using an OAuth access token, the `EVENT_WRITE` scope is required.'
      operationId: EventRegistrationsController_checkInByToken
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInByTokenInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInOutcomeOutputResponseDto'
        '400':
          description: Invalid Event UUID, invalid token, or check-in is closed
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Event or registration not found
        '429':
          description: Rate limit exceeded
      summary: Check in a guest by scanned QR token
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
  /v2/events/{uuid}/registrations/approve-all:
    post:
      description: 'Approves the Event''s guests waiting for approval, optionally only those matching `search` or registered for `locationId`, as the roster''s Approve all does. A free Event approves them in this request and returns `completed` with the counts. A paid Event sends each guest a payment request in the background and returns `started`. The Event must be published and not cancelled. The authenticated user must be the Event''s owner, one of its hosts, an accepted co-host, or a member of the owning team. PBAC permission for team events: `calEvent.update`. If accessed using an OAuth access token, the `EVENT_WRITE` scope is required.'
      operationId: EventRegistrationsController_approveAll
      parameters:
      - name: uuid
        required: true
        in: path
        description: Event UUID. Accepts the canonical UUID (e.g. `018ff5cd-6dc4-7d57-bcbc-374702ca8b38`) or its short-uuid (Flickr Base58) form (e.g. `1cbZYoAFoJdwqN4tixezd5`).
        schema:
          format: uuid
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveAllRegistrationsInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveAllOutcomeOutputResponseDto'
        '400':
          description: Invalid Event UUID or body, the Event is not open for registration, or too many pending guests
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Event not found
        '429':
          description: Rate limit exceeded
      summary: Approve every pending guest
      tags:
      - Events
      x-oauth-scopes:
      - EVENT_WRITE
  /v2/events/{uuid}/registrations/{registrationId}/approve:
    post:
