          example: Meeting with {Attendee name} for {Link title}
        allowAffectingUpcomingBookings:
          type: boolean
          description: 'Allows this update to affect upcoming bookings when a live confirmation session exists. Not stored and not returned. `true` confirms the edit:

            - Turning seats off cancels every attendee and booking attempt, and new bookings are taken one at a time.

            - Turning confirmation off rejects pending requests, leaves accepted attendees, and confirms new booking attempts until the seats are full.

            - Setting the seat cap below the seats already accepted keeps existing bookings and their seats, and applies the lower cap to new bookings and later confirmations.

            `false` and omitting the field leave the update refused when it would affect upcoming bookings.'
        locations:
          type: array
          description: 'Locations where the event will take place. If not provided, cal video link will be used as the location. Note: Setting a location to a conferencing app does not install the app - the app must already be installed. Via API, only Google Meet (google-meet), Microsoft Teams (office365-video), and Zoom (zoom) can be installed. Cal Video (cal-video) is installed by default. All other conferencing apps must be connected via the Cal.com web app and are not available for Platform plan customers. You can only set an event type location to an app that has already been installed or connected.'
