          type: string
        disableOnPrefill:
          type: boolean
          description: Disable this booking field if the URL contains query parameter with key equal to the slug and prefill it with the provided value.    For example, if the slug is `my-field` and the URL contains `&my-field=value`,    the field will be prefilled with this value and disabled.
