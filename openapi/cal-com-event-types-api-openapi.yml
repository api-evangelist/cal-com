openapi: 3.2.0
info:
  title: Cal.com API v2 Event Types API
  description: ''
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Event Types
paths:
  /v2/event-types/{eventTypeId}/calendar-invites:
    get:
      description: Returns host and guest invite-description settings resolved from the event type, organization default when the mode is `inherit`, then Cal.com's standard description. Access matches reading the event type; OAuth clients require `EVENT_TYPE_READ`. Custom templates are limited to 5,000 characters. Managed children inherit their parent's templates and are marked read-only. Host templates are private and are not included in event-type responses.
      operationId: EventTypesController_2026_06_12_getEventTypeCalendarInvites
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeCalendarInvitesOutput'
      summary: Get event-type calendar-invite templates
      tags:
      - Event Types
      x-oauth-scopes:
      - EVENT_TYPE_READ
    patch:
      description: Updates host and/or guest settings without changing other event-type fields; omitted audiences remain unchanged. `inherit` uses the organization default, `standard` uses Cal.com's standard description, and `custom` uses a supplied template of at most 5,000 characters. HTML tags are stripped and Markdown links are kept. Managed children are read-only and return HTTP 400; update their parent. Access matches updating the event type; OAuth clients require `EVENT_TYPE_WRITE`.
      operationId: EventTypesController_2026_06_12_updateEventTypeCalendarInvites
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarInvitesInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeCalendarInvitesOutput'
      summary: Update event-type calendar-invite templates
      tags:
      - Event Types
      x-oauth-scopes:
      - EVENT_TYPE_WRITE
  /v2/event-types:
    post:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section.


        If `bookingFields` is omitted, the event type is created with its default booking fields. At least one contact field—`email` or `attendeePhoneNumber`—must remain visible and required. Other default fields, such as additional notes, can be hidden. Provide `bookingFields` to customize the default fields or add custom booking fields. If accessed using an OAuth access token, the `EVENT_TYPE_WRITE` scope is required.'
      operationId: EventTypesController_2026_06_12_createEventType
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventTypeInput_2026_06_12'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventTypeOutput_2026_06_12'
      summary: Create an event type
      tags:
      - Event Types
      x-mcp:
        name: create_event_type
        guidance: 'Create a new event type. Required: title, slug, lengthInMinutes. Supports locations, booking fields, buffers, recurrence, confirmation policy, seats, and more.'
      x-oauth-scopes:
      - EVENT_TYPE_WRITE
    get:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Hidden event types and hidden booking fields are returned only when listing your own event types. Other callers see public event types and visible booking fields.'
      operationId: EventTypesController_2026_06_12_getEventTypes
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: username
        required: false
        in: query
        description: The username of the user to get event types for. If only username provided will get all event types.
        schema:
          type: string
      - name: eventSlug
        required: false
        in: query
        description: Slug of event type to return. Notably, if eventSlug is provided then username must be provided too, because multiple users can have event with same slug.
        schema:
          type: string
      - name: usernames
        required: false
        in: query
        description: Get dynamic event type for multiple usernames separated by comma. e.g `usernames=alice,bob`
        schema:
          type: string
      - name: orgSlug
        required: false
        in: query
        description: slug of the user's organization if he is in one, orgId is not required if using this parameter
        schema:
          type: string
      - name: orgId
        required: false
        in: query
        description: ID of the organization of the user you want the get the event-types of, orgSlug is not needed when using this parameter
        schema:
          type: number
      - name: sortCreatedAt
        required: false
        in: query
        description: Sort event types by creation date. When not provided, no explicit ordering is applied.
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: false
        schema:
          type: string
      - name: x-cal-secret-key
        in: header
        description: For platform customers - OAuth client secret key
        required: false
        schema:
          type: string
      - name: x-cal-client-id
        in: header
        description: For platform customers - OAuth client ID
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventTypesOutput_2026_06_12'
      summary: List event types
      tags:
      - Event Types
      x-mcp:
        name: get_event_types
        guidance: List event types. Without parameters returns all event types for the authenticated user. Pass 'username' to list another user's event types, or username + eventSlug for a specific one. Use usernames (comma-separated) for dynamic group event types.
      x-oauth-scopes: []
  /v2/event-types/{eventTypeId}/history:
    get:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        If accessed using an OAuth access token, the `EVENT_TYPE_READ` scope is required.


        Only the event type owner and applicable administrators can view its history. General event type read access does not include access to its history.'
      operationId: EventTypesController_2026_06_12_getEventTypeHistory
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: limit
        required: false
        in: query
        description: The number of audit logs to return. Defaults to 25 and cannot exceed 50.
        schema:
          minimum: 1
          maximum: 50
          example: 25
          type: number
      - name: cursor
        required: false
        in: query
        description: Cursor from the previous response. Pass `pagination.nextCursor` to fetch the next page of audit logs.
        schema:
          maxLength: 2048
          example: eyJjcmVhdGVkQXQiOiIyMDI2LTAxLTAxVDAwOjAwOjAwLjAwMFoiLCJpZCI6IjAxSFgifQ
          type: string
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventTypeHistoryOutput_2024_06_14'
      summary: Get event type history
      tags:
      - Event Types
      x-mcp:
        name: get_event_type_history
        guidance: Get the audit history (change log) for an event type by ID (use get_event_types to find IDs). Returns audit log entries showing what changed, who made the change, when, and the previous/new field values, ordered most recent first. Supports cursor pagination via limit (1-50, default 25) and cursor. Requires audit-history access to the event type — general read access alone is not sufficient.
      x-oauth-scopes:
      - EVENT_TYPE_READ
  /v2/event-types/{eventTypeId}/scheduling-config:
    get:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        The response varies by the event type''s scheduling type, and non-team event types are rejected.


        If accessed using an OAuth access token, the `EVENT_TYPE_READ` scope is required.'
      operationId: EventTypesController_2026_06_12_getSchedulingConfig
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSchedulingConfigOutput'
      summary: Get scheduling configuration
      tags:
      - Event Types
      x-mcp:
        name: get_scheduling_config
        guidance: 'Get the scheduling configuration for a team event type. For roundRobin types: returns hosts (with priority, weight, mandatory status, group assignment), host groups, distribution settings (maxLeadThreshold), and advanced settings (weights enabled, no-show calculation, CRM fallback). For collective/managed types: returns hosts with basic info and assignAllTeamMembers. The event type must be a team event type — returns 422 otherwise.'
      x-oauth-scopes:
      - EVENT_TYPE_READ
  /v2/event-types/{eventTypeId}/crm-sync-errors:
    get:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        By default, only active CRM sync errors are returned; pass `includeDismissed=true` to include dismissed errors.


        If accessed using an OAuth access token, the `EVENT_TYPE_READ` scope is required.'
      operationId: EventTypesController_2026_06_12_getCrmSyncErrors
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: appSlug
        required: true
        in: query
        description: CRM app slug connected to the event type, for example `salesforce`.
        schema:
          example: salesforce
          type: string
      - name: includeDismissed
        required: false
        in: query
        description: When true, returns dismissed historical errors as well as active errors. Defaults to false.
        schema:
          default: false
          example: true
          type: boolean
      - name: cursor
        required: false
        in: query
        description: Opaque cursor from `pagination.nextCursor`. Omit to fetch the first page of CRM sync errors.
        schema:
          example: eyJ2IjoxLCJzb3J0VXVpZCI6IjAxOWVhODUwLWVmYzctN2E0OC04NTA4LWFlZDMxYjcyY2U2OCJ9
          type: string
      - name: limit
        required: false
        in: query
        description: Maximum number of CRM sync errors to return.
        schema:
          minimum: 1
          maximum: 100
          default: 50
          example: 50
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCrmSyncErrorsOutput_2024_06_14'
      summary: List CRM sync errors for an event type
      tags:
      - Event Types
      x-mcp:
        name: get_crm_sync_errors
        guidance: List CRM sync errors for an event type and CRM app slug, such as salesforce. By default returns active/current errors only; set includeDismissed=true to include dismissed historical errors. Use eventTypeId plus appSlug, not credentialId. Supports cursor pagination via limit (1-100, default 50) and cursor. Requires read access to the event type.
      x-oauth-scopes:
      - EVENT_TYPE_READ
  /v2/event-types/{eventTypeId}:
    get:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Returns hidden booking fields only to callers who are allowed to view them. If accessed using an OAuth access token, the `EVENT_TYPE_READ` scope is required.'
      operationId: EventTypesController_2026_06_12_getEventTypeById
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        description: Numeric event type ID or its UUID. Accepts the canonical UUID or its short-uuid (Flickr Base58) form, e.g. the one in an app.cal.com/links/{uuid} URL.
        schema:
          oneOf:
          - type: integer
          - type: string
            format: uuid
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventTypeOutput_2026_06_12'
      summary: Get an event type
      tags:
      - Event Types
      x-mcp:
        name: get_event_type
        guidance: Get a specific event type by its numeric ID or UUID (use get_event_types to find IDs). Returns full details including locations, booking fields, and schedule.
      x-oauth-scopes:
      - EVENT_TYPE_READ
    patch:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Omit `bookingFields` to keep the existing booking fields. If provided, the array replaces them, and any omitted default fields are restored with their default settings. If accessed using an OAuth access token, the `EVENT_TYPE_WRITE` scope is required.'
      operationId: EventTypesController_2026_06_12_updateEventType
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventTypeInput_2026_06_12'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateEventTypeOutput_2026_06_12'
      summary: Update an event type
      tags:
      - Event Types
      x-mcp:
        name: update_event_type
        guidance: Update an existing event type by ID (use get_event_types to find IDs). Any provided field replaces the current value. Array fields (locations, bookingFields) replace entirely — fetch the current event type first with get_event_type to avoid losing existing values.
      x-oauth-scopes:
      - EVENT_TYPE_WRITE
    delete:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        If accessed using an OAuth access token, the `EVENT_TYPE_WRITE` scope is required.'
      operationId: EventTypesController_2026_06_12_deleteEventType
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteEventTypeOutput_2024_06_14'
      summary: Delete an event type
      tags:
      - Event Types
      x-mcp:
        name: delete_event_type
        guidance: Permanently delete an event type by ID. This action is irreversible — confirm with the user before proceeding.
      x-oauth-scopes:
      - EVENT_TYPE_WRITE
  /v2/event-types/{eventTypeId}/booking-fields:
    get:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Returns default and custom booking fields, plus any read-only workflow-added fields. If accessed using an OAuth access token, the `EVENT_TYPE_READ` scope is required.'
      operationId: EventTypesController_2026_06_12_getBookingFields
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFieldsOutput_2026_06_12'
      summary: Get booking fields
      tags:
      - Event Types
      x-oauth-scopes:
      - EVENT_TYPE_READ
    put:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Replaces all booking fields. Omitted custom fields are deleted, while omitted default fields are restored with their default settings. Use `PATCH` to update specific fields. Workflow-added fields are read-only and ignored. If accessed using an OAuth access token, the `EVENT_TYPE_WRITE` scope is required.'
      operationId: EventTypesController_2026_06_12_replaceBookingFields
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingFieldsInput_2026_06_12'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFieldsOutput_2026_06_12'
      summary: Replace booking fields
      tags:
      - Event Types
      x-oauth-scopes:
      - EVENT_TYPE_WRITE
    post:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Adds custom booking fields. Default and workflow-added fields cannot be added through this endpoint. If accessed using an OAuth access token, the `EVENT_TYPE_WRITE` scope is required.'
      operationId: EventTypesController_2026_06_12_createCustomBookingFields
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingFieldsInput_2026_06_12'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFieldsOutput_2026_06_12'
      summary: Add custom booking fields
      tags:
      - Event Types
      x-oauth-scopes:
      - EVENT_TYPE_WRITE
    patch:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Updates the booking fields identified by `slug`. Omitted properties keep their current values. Workflow-added fields are read-only. If accessed using an OAuth access token, the `EVENT_TYPE_WRITE` scope is required.'
      operationId: EventTypesController_2026_06_12_updateBookingFields
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
          example: '2026-06-12'
          default: '2026-06-12'
      - name: eventTypeId
        required: true
        in: path
        schema:
          type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBookingFieldsInput_2026_06_12'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFieldsOutput_2026_06_12'
      summary: Update booking fields
      tags:
      - Event Types
      x-oauth-scopes:
      - EVENT_TYPE_WRITE
  /v2/event-types/{eventTypeId}/booking-fields/{slug}:
    delete:
      description: 'Please make sure to pass in the cal-api-version header value as mentioned in the Headers section. Not passing the correct value will default to an older version of this endpoint.


        Deletes the custom booking field identified by `slug`. Default fields cannot be deleted, set hidden instead. If accessed using an OAuth access token, the `EVENT_TYPE_WRITE` scope is required.'
      operationId: EventTypesController_2026_06_12_deleteCustomBookingField
      parameters:
      - name: cal-api-version
        in: header
        description: Must be set to 2026-06-12. If not set to this value, the endpoint will default to an older version.
        required: true
        schema:
          type: string
