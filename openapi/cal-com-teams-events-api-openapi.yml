          default: PUBLIC
        capacity:
          type:
          - number
          - 'null'
          minimum: 1
          description: 'The most guests the Event can take. Omit or pass null for unlimited. Ignored once any location has its own `capacity`: the Event then takes the sum of the location capacities, or is unlimited if any location has none. The waitlist only opens when the Event or the chosen location is full, so it only works when capacity is set on the Event or on a location.'
          maximum: 100000
        waitlistEnabled:
          type: boolean
          description: Let guests join a waitlist when the Event is full. The waitlist only opens when the Event or the chosen location is full, so it only works when capacity is set on the Event or on a location.
          default: false
        paymentTimeoutMinutes:
          type:
          - number
          - 'null'
          minimum: 10
          maximum: 10080
          description: How many minutes a guest's seat is held while they pay. null uses the default of 10 minutes.
