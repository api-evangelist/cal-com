openapi: 3.2.0
info:
  title: Cal.com API v2 Teams / Events API
  description: ''
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Teams / Events
paths:
  /v2/teams/{teamId}/events:
    get:
      description: 'Returns every Event the team owns, including ones the authenticated user neither hosts nor co-hosts. The user must be an accepted member of the team, or of its parent organization. PBAC permission: `calEvent.read`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control. Ordered by start time, newest first when `status` is omitted.


        Cursor-based pagination: pass `pagination.nextCursor` from a previous response as the `cursor` query parameter to fetch the next page; omit `cursor` for the first page. `pagination.hasMore` is `false` and `pagination.nextCursor` is `null` on the last page.


        Must pass `cal-api-version: 2026-05-01` (or later). Older versions use `take`/`skip` offset pagination.


        Events are fixed-date RSVP pages served at cal.com/{slug}; they are not event types (bookable meeting templates) or calendar events. If accessed using an OAuth access token, the `TEAM_EVENT_READ` scope is required.'
      operationId: TeamsEventsController_listCursor
      parameters:
      - name: cursor
        required: false
        in: query
        description: Opaque cursor for cursor-based pagination. Pass the `pagination.nextCursor` value from a previous response to fetch the next page. Omit to fetch the first page.
        schema:
          example: eyJ2IjoyLCJzdGFydFRpbWUiOiIyMDMwLTAxLTAxVDAwOjAwOjAwLjAwMFoiLCJldmVudFR5cGVVdWlkIjoiMDE4ZjRjMmUtM2YxYS03YWJjLTlkZWYtMDEyMzQ1Njc4OWFiIn0
          type: string
      - name: limit
        required: false
        in: query
        description: Maximum number of Events to return.
        schema:
          minimum: 1
          maximum: 250
          default: 50
          example: 25
          type: number
      - name: slug
        required: false
        in: query
        description: Filter by the event's public page slug (cal.com/{slug}).
        schema:
          example: team-offsite
          type: string
      - name: status
        required: false
        in: query
        description: 'Filter events by lifecycle status. `draft`: not published and not cancelled, ordered soonest first. `upcoming`: published and not yet ended, or cancelled but not yet started, ordered soonest first. `past`: everything else, ordered latest first. Omit to return all statuses, newest first. When provided, `pagination.nextCursor` encodes the status — cursors from one status value cannot be used with another and return 400.'
        schema:
          example: upcoming
          type: string
          enum:
          - draft
          - upcoming
          - past
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: cal-api-version
        in: header
        description: Must be set to 2026-05-01 (or a later API version) for cursor pagination.
        required: true
        schema:
          type: string
          example: '2026-05-01'
          default: '2026-05-01'
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsCursorOutputResponseDto'
        '400':
          description: Invalid cursor
        '401':
          description: Unauthenticated
        '403':
          description: Not a member of the team, or insufficient permissions
      summary: List a team's Events (cursor pagination)
      tags:
      - Teams / Events
      x-oauth-scopes:
      - TEAM_EVENT_READ
    post:
      description: 'Creates a draft Event owned by the team. A draft is not public and nobody can register until it is published with `POST /v2/events/{uuid}/publish`. The user must be an accepted member of the team, or of its parent organization. PBAC permission: `calEvent.create`. Learn more about API access control at https://cal.com/docs/api-reference/v2/access-control.


        `startTime` and `endTime` are ISO 8601 in UTC; `startTime` must not be in the past and `endTime` must be after `startTime`.


        `guestList` controls whether guests see names, a count, or neither. `locations` sets where the Event happens; set `price` and `currency` on a location to charge for that place.


        Events are fixed-date RSVP pages served at cal.com/{slug}; they are not event types (bookable meeting templates) or calendar events.


        If accessed using an OAuth access token, the `TEAM_EVENT_WRITE` scope is required.'
      operationId: TeamsEventsController_create
      parameters:
      - name: teamId
        required: true
        in: path
        description: The team's uuid (preferred), its short-uuid (Flickr Base58) form, or its numeric id.
        schema:
          anyOf:
          - type: string
          - type: number
      - name: Authorization
        in: header
        description: value must be `Bearer <token>` where `<token>` is api key prefixed with cal_, managed user access token, or OAuth access token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventInput'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOutputResponseDto'
        '400':
          description: Invalid input, or a start time in the past
        '401':
          description: Unauthenticated
        '403':
          description: Not a member of the team, or insufficient permissions
      summary: Create a team Event
      tags:
      - Teams / Events
      x-oauth-scopes:
      - TEAM_EVENT_WRITE
