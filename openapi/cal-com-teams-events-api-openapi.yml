    EventOutputDto:
      type: object
      properties:
        uuid:
          type: string
          description: Unique identifier of the Event.
        slug:
          type: string
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        startTime:
          format: date-time
          type: string
        endTime:
          format: date-time
          type: string
        checkInOpensAt:
          format: date-time
          type: string
          description: 'When hosts can start checking guests in: 12 hours before `startTime`.'
        checkInClosesAt:
          format: date-time
          type: string
          description: 'When check-in closes: 12 hours after `endTime`.'
        timeZone:
          type: string
        visibility:
          enum:
          - PUBLIC
          - UNLISTED
          type: string
        category:
          enum:
          - meetup
          - conference
          - music
          - sports
          type: string
          description: What kind of event it is.
        hidden:
          type: boolean
        publishedAt:
          format: date-time
          type:
          - string
          - 'null'
        cancelledAt:
          format: date-time
          type:
          - string
          - 'null'
        status:
          enum:
          - draft
          - published
          - cancelled
          type: string
          description: 'Lifecycle status that summarises hidden, publishedAt and cancelledAt: cancelled when the Event was cancelled, published once published, draft otherwise.'
        locations:
          type: array
          items:
            oneOf:
            - title: Address
              $ref: '#/components/schemas/EventAddressLocationOutput'
            - title: Link
              $ref: '#/components/schemas/EventLinkLocationOutput'
            - title: Integration
              $ref: '#/components/schemas/EventIntegrationLocationOutput'
            - title: Organizer Default App
              $ref: '#/components/schemas/EventOrganizersDefaultAppLocationOutput'
            - title: Unknown
              $ref: '#/components/schemas/EventUnknownLocationOutput'
        coverImageUrl:
          type:
          - string
          - 'null'
        requiresApproval:
          type: boolean
        paymentTimeoutMinutes:
          type:
          - number
          - 'null'
          description: How many minutes a guest's seat is held while they pay. null uses the default of 10 minutes.
        waitlistEnabled:
          type: boolean
          description: Whether guests can join a waitlist when the Event is full. The waitlist only opens when the Event or the chosen location is full, so it only works when capacity is set on the Event or on a location.
        showOrganizerEmail:
          type: boolean
          description: Whether guests can see the organizer's email.
        guestList:
          enum:
          - hidden
          - names
          - count
          type: string
          description: 'Who guests can see on the Event''s page: their names, only the count, or neither.'
        showPresentedBy:
          type: boolean
          description: Whether the Event shows who it is presented by.
        confirmedCount:
          type: number
          description: Confirmed guest count. Returned when listing Events and omitted when fetching a single Event by uuid.
        liveStreams:
          description: Links where people can watch the event live, in display order.
          type: array
          items:
            $ref: '#/components/schemas/EventLiveStreamOutput'
        theme:
          enum:
          - light
          - dark
          type:
          - string
          - 'null'
          description: Default theme of the event page; null follows the visitor's system setting.
        poster:
          description: Poster cover design. The web app draws `coverImageUrl` from it. null when the cover is an uploaded image.
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/EventPosterOutput'
        lineup:
          description: Speakers or performers on the event page. Returned on single-Event responses, not on Event lists.
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/EventLineupOutput'
        schedule:
          description: Agenda on the event page. Returned on single-Event responses, not on Event lists.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EventScheduleItemOutput'
        background:
          description: Animated background of the event page.
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/EventBackgroundOutput'
        registrationFields:
          type: array
          description: Questions guests answer when registering. Always includes name and email.
          items:
            discriminator:
              propertyName: field
            oneOf:
            - title: Default Name
              discriminator:
                propertyName: variant
              oneOf:
              - title: Default Full Name
                $ref: '#/components/schemas/SystemFullNameFieldOutput_2026_06_12'
              - title: Default Split Name
                $ref: '#/components/schemas/SystemSplitNameFieldOutput_2026_06_12'
            - title: Default Email
              $ref: '#/components/schemas/SystemEmailFieldOutput_2026_06_12'
            - title: Default Location
              $ref: '#/components/schemas/SystemLocationFieldOutput_2026_06_12'
            - title: Default Title
              $ref: '#/components/schemas/SystemTitleFieldOutput_2026_06_12'
            - title: Default Notes
              $ref: '#/components/schemas/SystemNotesFieldOutput_2026_06_12'
            - title: Default Guests
              $ref: '#/components/schemas/SystemGuestsFieldOutput_2026_06_12'
            - title: Default Reschedule Reason
              $ref: '#/components/schemas/SystemRescheduleReasonFieldOutput_2026_06_12'
            - title: Default Attendee Phone
              $ref: '#/components/schemas/SystemAttendeePhoneFieldOutput_2026_06_12'
            - title: Workflow-added SMS Reminder
              $ref: '#/components/schemas/SystemSmsReminderFieldOutput_2026_06_12'
            - title: Workflow-added AI Agent Phone
              $ref: '#/components/schemas/SystemAiAgentPhoneFieldOutput_2026_06_12'
            - title: Custom Booking Field
              discriminator:
                propertyName: type
              oneOf:
              - title: Custom Email
                $ref: '#/components/schemas/CustomEmailFieldOutput_2026_06_12'
              - title: Custom Phone
                $ref: '#/components/schemas/CustomPhoneFieldOutput_2026_06_12'
              - title: Custom Address
                $ref: '#/components/schemas/CustomAddressFieldOutput_2026_06_12'
              - title: Custom Short Text
                $ref: '#/components/schemas/CustomShortTextFieldOutput_2026_06_12'
              - title: Custom Number
                $ref: '#/components/schemas/CustomNumberFieldOutput_2026_06_12'
              - title: Custom Long Text
                $ref: '#/components/schemas/CustomLongTextFieldOutput_2026_06_12'
              - title: Custom Select
                $ref: '#/components/schemas/CustomSelectFieldOutput_2026_06_12'
              - title: Custom Multi-Select
                $ref: '#/components/schemas/CustomMultiSelectFieldOutput_2026_06_12'
              - title: Custom Multiple Emails
                $ref: '#/components/schemas/CustomMultiEmailFieldOutput_2026_06_12'
              - title: Custom Checkbox Group
                $ref: '#/components/schemas/CustomCheckboxGroupFieldOutput_2026_06_12'
              - title: Custom Radio Group
                $ref: '#/components/schemas/CustomRadioGroupFieldOutput_2026_06_12'
              - title: Custom Checkbox
                $ref: '#/components/schemas/CustomCheckboxFieldOutput_2026_06_12'
              - title: Custom URL
                $ref: '#/components/schemas/CustomUrlFieldOutput_2026_06_12'
            - title: Unknown Booking Field
              $ref: '#/components/schemas/UnknownBookingFieldOutput_2026_06_12'
        hosts:
          description: Ordered host roster, creator first. External co-hosts are not included.
          type: array
          items:
            $ref: '#/components/schemas/EventHostOutput'
        capacity:
          type:
          - number
          - 'null'
          description: The most guests the Event can take; null when unlimited. Once any location has its own `capacity`, this is the sum of the location capacities, or null if any location has none. The waitlist only opens when the Event or the chosen location is full, so it only works when capacity is set on the Event or on a location.
          example: 100
        price:
          type:
          - number
          - 'null'
          description: Price of an Event without locations, in the currency's smallest unit; null when free. Events with locations are priced per location.
          example: 1500
        currency:
          type:
          - string
          - 'null'
          description: Cal Pay currency code of `price`.
          example: usd
        paymentsEnabled:
          type: boolean
          description: Whether paid Events are available. When false, setting `price` on the Event or a location returns a 400.
          example: true
        cancellationReason:
          type:
          - string
          - 'null'
        userId:
          type:
          - number
          - 'null'
          description: Owner user id for a personal Event; null for a team-owned one.
        teamId:
          type:
          - number
          - 'null'
          description: Owning team id for a team-owned Event; null for a personal one.
